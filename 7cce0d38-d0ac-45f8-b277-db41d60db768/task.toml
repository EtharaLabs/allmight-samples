[environment.healthcheck]
command = "test -s /etc/seatwise/services.env && curl -fsS http://127.0.0.1:8025/healthz && curl -fsS http://127.0.0.1:4242/healthz"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 60.0
start_interval_sec = 2.0
retries = 5
