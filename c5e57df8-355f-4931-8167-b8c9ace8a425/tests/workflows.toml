# One strict workflow per entry: the workflow scores only when every substep passes (tests/scoring.py).
# critical = core business correctness: a failed critical workflow caps every workflow at critical_cap.

[scoring]
critical_cap = 0.4

[[workflow]]
id = "W01"
title = "Password links, sign-in, sessions and return paths (anti-enumeration, single use, expiry, fixation, open redirect)"
weight = 3
critical = false

[[workflow]]
id = "W02"
title = "Setting up: customers, users, SKUs, receipts and prices with validation, lot identity and role checks"
weight = 3
critical = false

[[workflow]]
id = "W03"
title = "Order pricing rules: tier prices on the ship date, per-line tax, dimensional-weight freight, cold chain, free freight"
weight = 5
critical = true

