    why_the_count_is_two_and_not_ten: >-
      The operator directed at least ten judged items and instructed that the
      number be treated as a direction and never as a target, with no item
      authored at any mode to reach it. The measured count is two, and this
      field records why rather than reporting the direction as met.

      The lawful route named was further prose obligations rather than finer
      slicing of the prose already obliged, and the corpus bounds how far that
      route runs. Recomputed from environment/inputs/: the eligibility graph
      holds exactly one contention, over TXN-1007 and TXN-1009 against RCP-0008
