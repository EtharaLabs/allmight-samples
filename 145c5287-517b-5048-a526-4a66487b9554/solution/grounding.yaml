    contested_reason_is_the_operative_rule stand at mode judged. Their own
    liveness against those two controls is an authored expectation until a
    judge runs, and is not claimed as measured here.
  exclusivity_measured: >-
    The two compiled items over D6-contested-account occupy different cells,
    outcome and coverage, so item 7e's clause against two items of one
    obligation and dimension giving the same verdict is not engaged for them.
    Their divergence is proven anyway, in both directions, because resting on
    the scoping would be a weaker claim than the bytes support.

    With RCP-0011 replaced throughout the TXN-1009 section by the phrase "the
    other receipt", leaving the three-section shape intact,
    contested_account_structure passes and
    contested_account_names_an_alternative fails. With one heading rewritten to
    "## TXN-9999", which is no row of environment/inputs/statement.csv,
    contested_account_structure fails and
    contested_account_names_an_alternative passes. Each therefore fails on a
