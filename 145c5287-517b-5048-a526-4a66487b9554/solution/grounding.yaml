    - id: policy-magnitude-is-arithmetically-true
      criterion: >-
        In each section of /app/out/policy-notes.md that states by how many
        cents the receipt total exceeds or falls short of its category limit,
        that figure is the arithmetic difference between the two numbers the
        section names.
      obligation: D7-policy-rationale
      dimension: process
      evaluation_target: /app/out/policy-notes.md
      claimed_residue: >-
        A stated magnitude can be false beside a true relation and a true
        verdict, and the subtraction is a third predication distinct from both.
      measured: >-
        Re-derived from the oracle's own output rather than from a list. The
        oracle writes "8100 strictly exceeds 7500, by 600 cents" for RCP-0005,
        "by 2410 cents" for RCP-0008, "by 2445 cents" for RCP-0011 and
        "falling short of it by 1800 cents" for RCP-0001. A carrier can keep
        the relation, the verdict, the receipt total and the governing cap all
        correct and assert "by 2400 cents" instead of 600, and every integer
        the two compiled items read is still present, because
        policy_notes_names_the_governing_limit requires the total and the cap
        and forbids a neighbouring category's cap but says nothing about a
        third number. The existing judged item
        policy_verdict_follows_from_the_two_numbers grades the relation between
        the two numbers and the verdict that relation entails, and a false
        magnitude leaves both of those true, so this is a distinct defect in
        the same cell rather than a restatement.
      ruling: ADMITTED-NOT-AUTHORED
      admitted_by: >-
        The admits clause: it names the carrier, an exact arithmetic relation a
        reader can test, and one condition. It survives the reducibility clause
        only on the reading that the magnitude is a claim about two numbers the
        prose itself chooses to name, rather than a value recomputable before
        the prose is read.
      not_authored_because: >-
        Ruled surviving-but-marginal and held back on that ground rather than
        on scope. Two doubts stand unresolved and both need a measurement
        before any prose is frozen. The first is whether the judgment reduces
        after all: the magnitude is the difference of two integers the compiled
