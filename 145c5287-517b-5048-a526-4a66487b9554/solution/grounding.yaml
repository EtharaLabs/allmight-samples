        In each section of /app/out/policy-notes.md, the relation the prose
        asserts between the receipt total and the category limit it names is the
        relation those two numbers actually stand in, and the violation verdict
        the prose states for that pair is the one that relation entails.
      obligation: D7-policy-rationale
      dimension: process
      evaluation_target: /app/out/policy-notes.md
      claimed_residue: >-
        Whether a stated inequality between two integers holds is a predication
        about them, not the presence of either.
      measured: >-
        Measured by execution rather than argued. A carrier identical to the
        oracle's except that its RCP-0005 section reads "8100 does not exceed
