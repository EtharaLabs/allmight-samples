    - id: parse-hazard-account-is-faithful
      criterion: >-
        In each section of a written parse account, the mechanism the prose
        gives for why a naive reading corrupts that receipt is the mechanism the
        receipt's own bytes exhibit, and the correct reading it states is the
        one the stated field rule produces.
      obligation: D8-parse-rationale
      dimension: process
      evaluation_target: not yet authored
      claimed_residue: >-
        Which receipts carry a hazard is recomputable, but whether the prose
        attributes the corruption to the right mechanism is a predication.
      measured: >-
        Re-derived from environment/inputs/receipts/ rather than from the
        operator's list. Three receipts carry a hazard and they are not the same
        hazard: RCP-0003 reads VENDOR "Heliotype Software: Annual Plan" and
        RCP-0007 reads VENDOR "Meridian Coach Lines: Route 42", both of which a
        split-on-every-colon parse truncates to "Heliotype Software" and
        "Meridian Coach Lines" while dropping the remainder; RCP-0004 carries
        two trailing non-field lines, "Thank you for your business." and
        "Invoice generated automatically; retain for records.", which an
        every-line-is-a-field parse admits as fields. So an account can name all
        three receipts and still attribute the colon hazard to RCP-0004 or the
        trailing-line hazard to RCP-0003, and every token a comparator looks for
        is present in both the true and the false account.
      ruling: ADMITTED-AND-AUTHORED-AS-TWO
      admitted_by: >-
        The admits clause on the same reading that admitted candidate 10: it
        names the carrier, the computed property, an exact relation and one
        condition. It survives the reducibility clause because the hazard set is
        recomputable while the attribution of a mechanism to a receipt is not
        settled by token presence.
      prediction_verified: >-
        The measured field above was a prediction when written, and it was
        tested before any prose was frozen because a false prediction would
        have made the item reducible and so BLOCK:INVALID_TASK under item 7e.
        The test built a control from the oracle's own
        /app/out/parse-notes.md by swapping only the rule-naming sentence,
        leaving every heading, every quoted vendor value and every quoted
        dropped fragment exactly as written. Both compiled items returned True
        on the swapped carrier and True on the oracle, so the prediction holds:
        a comparator over the carrier's bytes does not separate the true
        account from the misattributed one.

        The mechanism, read from the checker source rather than inferred.
        parse_notes_covers_every_hazard compares the heading list against the
        hazard set recomputed from environment/inputs/receipts/ and requires a
        non-empty body, so it reads no rule-naming sentence.
        parse_notes_quotes_the_correct_value branches on whether the receipt's
        own bytes carry a colon in VENDOR, taken from the receipt rather than
        from the prose, and then requires the true vendor string plus either
        the truncated form or the non-field lines. The swap moves none of those
        strings.
      authored_as_two_because: >-
        Item 10f states that a criterion joining two conditions is two items,
        and this candidate joins two. The corpus carries two distinct
        mechanisms over different extents: the colon rule on RCP-0003 and
        RCP-0007, and the trailing-non-field-lines rule on RCP-0004. Each was
        measured independently misattributable, by rewriting only the colon
        sections and then only the non-field section; both halves returned
        True on both compiled items, so each has its own live control. A single
        item spanning both would fail on either and could not distinguish them,
        which is the overlap item 7e refuses within one cell.

        Authored as parse_notes_attributes_the_colon_mechanism at weight 5,
        whose mechanism spans two of three hazardous receipts, and
        parse_notes_attributes_the_nonfield_mechanism at weight 3, whose
        mechanism spans one. The weights differ on measured extent rather than
        on a preference about spread.
      not_authored_because: >-
        Its deliverable does not exist. The operator directed that one
        deliverable be authored at a time, fully wired, and reported before the
        next is opened, on the ground that the previous pass produced three
        independent BLOCK:INVALID_TASK conditions from a single new deliverable.
        D7-policy-rationale is the deliverable of this pass. This candidate is
        recorded as surviving its ruling so that the next pass authors against a
        ruling already made rather than re-deriving it, and it is stated as not
        authored rather than as pending.
    - id: credit-row-exclusion-is-explained
      criterion: >-
        In a written account of the credit row, the reason the prose gives for a
        signed-value comparison excluding TXN-1007 from the eligibility graph is
        the reason the shipped inputs make true for that row.
      criterion_retracted: >-
        This criterion is wrong in direction and is retracted rather than
        deleted, so the error stays readable beside its correction. It asserts
        that a signed-value comparison excludes TXN-1007 from the eligibility
        graph. Re-measured from environment/inputs/, the opposite holds:
        TXN-1007 is the one statement row a signed comparison does not exclude.

        The arithmetic, with amount_tolerance_cents 50. A debit row carries a
        negative amount_cents and a receipt TOTAL is unsigned, so for TXN-1001
        at -48200 against RCP-0001 at 48200 the signed delta is
        48200 - (-48200) = 96400, which exceeds the tolerance and is rejected,
        while the absolute delta is 48200 - 48200 = 0 and is admitted. For the
        credit row TXN-1007 at +9900 against RCP-0011 at 9945 the signed delta
        is 9945 - 9900 = 45 and the absolute delta is also 45, both inside the
        tolerance, so both conventions admit that edge.

        The conventions therefore coincide exactly where the row amount is
        already positive and diverge on every row where it is negative. Twelve
        absolute-rule edges collapse to one under the signed rule, the maximum
        matching falls from eleven pairs to one, and ten of twelve rows have a
        different eligible set. The two rows that coincide are TXN-1007, which
        both conventions admit, and TXN-1011, which neither admits because no
        receipt is eligible for it under either rule.

        A superseded report of this re-measurement overstated its scope by
        saying the measured field below was also backwards. It is not: that
        field already records that the conventions coincide for this row and
        diverge for every debit row, which the re-measurement confirms. Only
        this criterion string and the claimed_residue beneath it carried the
