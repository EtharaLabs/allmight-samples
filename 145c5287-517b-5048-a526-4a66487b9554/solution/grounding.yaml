    value while keeping the section set correct makes the second fail while the
    first passes.

    The two judged items do share one cell, D8-parse-rationale by process, so
    7e's distinctness clause is engaged for them and is satisfied on measured
    evidence. The colon control leaves all three sections claiming the
    non-field rule, which corrupts RCP-0003 and RCP-0007 and leaves RCP-0004
    correct by accident of the swap; the non-field control leaves all three
    claiming the colon rule, which corrupts RCP-0004 and leaves the other two
    correct. Each control therefore falsifies exactly one item of the pair and
    leaves the other satisfiable, which is the disjointness 7e requires.
  liveness_measured: >-
    Item 7e requires liveness against the oracle and every item 10a control,
    and the result is measured here rather than asserted. The oracle's own
