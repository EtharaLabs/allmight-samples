      obligation: D9-credit-row-rationale
      dimension: process
      evaluation_target: not yet authored
      claimed_residue: >-
        Why a comparison convention drops a row is a reason, not a value.
      claimed_residue_retracted: >-
        The residue stands and its subject moves. What no comparator settles is
        still a reason rather than a value, but the reason is why a signed
        comparison collapses the graph to the single credit-row edge, not why
        it drops that edge. An account naming TXN-1007, the sign convention and
        the tolerance while stating the consequence backwards carries every
        token a comparator looks for, which is the residue restated over the
        corrected fact.
      measured: >-
        Re-derived from environment/inputs/statement.csv. TXN-1007 at +9900 is
        the only positive amount among twelve rows, and the eligibility rule
        compares a receipt total against the absolute value of the row amount,
        so a solver comparing against the signed value computes a delta of
        9945 - 9900 = 45 for RCP-0011 under the absolute rule and
        9945 - (+9900) against a tolerance of 50 under the signed rule, which
        happens to coincide for this row and diverges for every debit row. The
        account's claim is therefore about a convention and its consequence, and
        a section naming TXN-1007, the sign and the tolerance can still state
        the consequence backwards.
      ruling: ADMITTED-NOT-AUTHORED
      admitted_by: >-
        The admits clause, on the same reading as candidates 10 and 11.
      not_authored_because: >-
        Its deliverable does not exist, and the one-deliverable-per-pass
        direction governs. Recorded as surviving rather than authored.
      caution_for_the_next_pass: >-
        This candidate needs care the other two do not. The measurement above
        shows the signed and absolute conventions coincide numerically for
        TXN-1007 against RCP-0011, so an account could state a true consequence
        from a false premise and a comparator could not tell. That makes the
        residue real, but it also means the deliverable must oblige the account
        to name which rows diverge rather than only that TXN-1007 is a credit,
        or the judged item will grade a claim the corpus cannot distinguish. The
        next pass must settle that in the statement before freezing prose.
      caution_bound_by_operator: >-
