    Every weight is in the one, three, five scale item 9g fixes.
  liveness_measured_d8: >-
    Item 7e requires liveness against the oracle and every item 10a control,
    and the D8 result is measured here rather than asserted. The oracle's own
    /app/out/parse-notes.md was produced by executing the generated
    solution/solver.py against environment/inputs/ with APP rebound to a
    scratch tree; it wrote exactly three sections headed RCP-0003, RCP-0004 and
    RCP-0007 in ascending order, attributing the colon rule to the first and
    third and the non-field rule to the second.

    Over that output and six derived carriers, the two compiled items of
    D8-parse-rationale resolve as follows. On the oracle both pass. On
    parse-notes-misattributes-the-colon-mechanism both pass. On
    parse-notes-misattributes-the-nonfield-mechanism both pass. On
    parse-notes-omits-a-hazardous-receipt coverage fails and quoting passes. On
    parse-notes-discusses-a-clean-receipt coverage fails and quoting passes,
    measured in both placements, appended after RCP-0007 and inserted in
    ascending position before RCP-0003, so the defect is the surplus member
    rather than the ordering. On parse-notes-misquotes-the-correct-value
    coverage passes and quoting fails. On parse-notes-absent both fail.

    The two passes on misattributed carriers are the residue stated as a
    measurement. A carrier that pins the non-field rule onto both colon
    receipts, and one that pins the colon rule onto the non-field receipt, are
    each accepted by every comparator over the prose bytes, because neither
    moves a string either checker reads. Only a reading of which rule each
    section attributes separates them from the oracle, which is why
    parse_notes_attributes_the_colon_mechanism and
    parse_notes_attributes_the_nonfield_mechanism stand at mode judged. Their
    own liveness against those two controls is an authored expectation until a
    judge runs, and is not claimed as measured.
  exclusivity_measured_d8: >-
    The two compiled items of D8-parse-rationale occupy different cells,
    coverage and outcome, so item 7e's clause against two items of one
    obligation and dimension giving the same verdict is not engaged for them.
    Their divergence is proven anyway in both directions, because resting on
    the scoping would be a weaker claim than the bytes support. Dropping the
    RCP-0004 section makes parse_notes_covers_every_hazard fail while
