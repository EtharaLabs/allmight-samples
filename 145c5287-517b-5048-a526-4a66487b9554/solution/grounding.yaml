# The corpus is carried unchanged from the superseded CLI slot, because the
# re-scope replaces the surface the solver builds and not the reconciliation
# domain underneath it: the two-source disagreement and the rules that resolve
# it are the thing still being built.
# ---------------------------------------------------------------------------
