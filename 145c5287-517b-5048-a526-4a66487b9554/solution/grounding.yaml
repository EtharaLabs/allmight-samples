    verify item 7e. The clause is now satisfied on evidence. The two items in
    D6-contested-account by process are the only judged items in the grid, and
    the deliverable they read is one instruction.md obliges, so the dimension is
    exercised by a graded obligation rather than discharged by a reason. The gap
