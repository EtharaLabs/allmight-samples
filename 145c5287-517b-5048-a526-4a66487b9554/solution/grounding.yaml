# ---------------------------------------------------------------------------
# The rendered surface the re-scope adds. These values fix what the two screens
# must carry; recompute.py writes them into the fixtures the browser checkers
# read, and the statement states each obligation in prose without naming a
# reference value.
# ---------------------------------------------------------------------------
screens:
  - id: review
    route: /
    purpose: >-
      The reconciliation review screen. It carries every matched pair as a row
      of a table whose element id is matched-table, every unreceipted txn_id in
      a list whose element id is unreceipted-list, and every unposted
      RECEIPT-ID in a list whose element id is unposted-list.
    required_element_ids:
      - matched-table
      - unreceipted-list
      - unposted-list
      - totals-matched
      - totals-unreceipted
      - totals-unposted
      - totals-violations
    row_contract: >-
      Each matched row carries a data-receipt-id attribute equal to its
      RECEIPT-ID, and six cells in this order: receipt id, txn id, amount delta
      in cents, date delta in days, category, and the policy state. A row whose
      pair violates policy carries the class violation on the row element.
  - id: detail
    route: /pair/<receipt_id>
    purpose: >-
      The per-pair detail screen, one per matched pair, reachable from its row.
      It carries the same six values under element ids pair-receipt-id,
      pair-txn-id, pair-amount-delta, pair-date-delta, pair-category and
      pair-policy-state, so the two screens can be compared against each other
      and against the JSON.
    required_element_ids:
      - pair-receipt-id
      - pair-txn-id
      - pair-amount-delta
      - pair-date-delta
      - pair-category
      - pair-policy-state

# The rendered-state obligations that exist only in a hydrated document. Each
# is measured by the verifier's browser against the served application and is
# unobservable in the bytes the server returns, because each is produced by
# CSS cascade, font resolution or layout rather than by markup.
rendered_state:
  violation_weight: 700
  violation_weight_note: >-
    A row whose pair violates policy resolves to a computed font-weight of 700
    on its policy-state cell; a compliant row resolves to 400. The statement
    states that a violation must be distinguishable in text weight and not by
    colour or position alone, and the computed weight is the resolved cascade
    value rather than a markup attribute.
  font_family_head: Liberation Sans
  font_family_note: >-
    Every graded cell resolves to a font the image ships, so
    document.fonts.check returns true at each element's own computed weight and
    size. A page that names a font the image lacks still serves identical
    bytes and renders in a fallback, which only a hydrated document reveals.
  column_alignment_tolerance_px: 1
  column_alignment_note: >-
    Within the matched table, every cell of one column shares a left edge to
    within one device-independent pixel at the named viewport. Markup alone
    does not establish this: a table whose cells carry correct text can still
    lay out ragged under a CSS rule that sizes columns per row.
  viewport:
    width: 1280
    height: 800
  viewport_note: >-
    The single named viewport at which every rendered-state obligation is
    measured. A geometry claim without a viewport is unfalsifiable, so the
    statement names this one and the verifier measures at it alone.

# ---------------------------------------------------------------------------
# Discovery: values a solver obtains only by interacting with the built
# environment, never by reading instruction.md. Each is established in
# environment state and derived below from its grounding source.
# ---------------------------------------------------------------------------
discovery:
  - id: matching-is-maximum-cardinality
    established_in: environment/inputs/statement.csv + environment/inputs/receipts/
    why: >-
      RCP-0011 is eligible for both TXN-1009, at an amount delta of -5 cents
      and a date delta of -1 day, and TXN-1007, at +45 cents and +3 days.
      RCP-0008 is eligible for TXN-1009 alone, at -40 cents and +1 day, and
      TXN-1007 admits RCP-0011 alone. A solver that orders eligible pairs by
      closeness and takes the best available edge first therefore gives
      TXN-1009 to RCP-0011, which strands RCP-0008 and leaves TXN-1007
      unmatched: ten pairs instead of eleven. Only a maximum-cardinality
      matching routes RCP-0011 to its worse edge and recovers both. Measured
      against the shipped corpus: greedy-by-closeness selects ten pairs and
      the maximum selects eleven, so every one of the four totals, both id
      lists, the matched array and every rendered row differ. The trap is in
      the data, not in the statement.
  - id: refund-row-is-a-credit
    established_in: environment/inputs/statement.csv
    why: >-
      TXN-1007 carries a positive amount_cents of 9900 while every other row
      is a debit. Eligibility compares the unsigned receipt total against the
      absolute value of the row amount, and the maximum matching assigns
      RCP-0011 to this row, so a solver comparing against the signed value
      finds no eligible receipt for it at all: the row falls out of the graph
      entirely, the matching drops to ten pairs, and TXN-1007 appears as
      unreceipted on the review screen. The sign convention is stated; that a
      credit row carries a graded match is established only in the corpus.
  - id: vendor-colon-and-noise-lines
    established_in: environment/inputs/receipts/
    why: >-
      RCP-0003 and RCP-0007 carry a colon inside VENDOR, and RCP-0004 carries
      two non-field lines. A split-on-every-colon parse or a
      every-line-is-a-field parse corrupts those three receipts. The
      statement admits both shapes; the environment is where they appear.
  - id: which-rows-carry-a-violation
    established_in: environment/inputs/ + the built application state
    why: >-
      Whether a matched pair violates policy follows from the receipt total,
      its category and the limits in policy.json, so which rows must render at
      the heavier weight is established only once the corpus is parsed and the
      maximum matching is computed. A solver cannot read the violating set
      from the statement: the statement states the rule and the rendering
      obligation, and the corpus decides which rows it applies to.
  - id: which-rows-are-contestable
    established_in: environment/inputs/statement.csv + environment/inputs/receipts/
    why: >-
      The sixth deliverable obliges an account of the three rows whose matching
      a reviewer is most likely to dispute, and the statement names no row. A
      row is contestable only where it had an alternative: TXN-1009 and TXN-1007
      contend for RCP-0011, which is why the maximum matching routes RCP-0011 to
      its worse edge at an amount delta of +45 cents and strands nothing, and
      why TXN-1009 falls to RCP-0008 at -40 cents instead of its nearest
      receipt. Which rows carry such contention, and which alternatives each was
      eligible for, is computed from the eligibility graph over the shipped
      corpus and is readable nowhere in the statement. A solver that never built
      the graph cannot name three contestable rows, and one that built a
      greedy-by-closeness matching names the wrong contention, because under
      greedy RCP-0011 takes TXN-1009 uncontested and TXN-1007 has no alternative
      to discuss at all.
    graded_by:
      - contested_account_structure
      - contested_account_names_an_alternative
      - contested_pairing_matches_declared_matching
      - contested_reason_is_the_operative_rule
    note: >-
      This value is what carries the new obligation's discovery dependency. It
      is not a restatement of matching-is-maximum-cardinality: that value fixes
      which eleven pairs exist, and this one fixes which rows had a losing
      alternative and what it was. The two judged items depend on both, because
      a faithful account must state the pairing the matching produced and the
      reason the contention resolved as it did.

discovery_floor:
  value: conservative-default
  source: >-
    No requirements/ value and no recorded touchstones/ disposition fixes a
    discovery floor, so it is carried by name rather than as a
    domain-specific number, per item 10a.1's "carried by name only with a
    conservative default". Every graded deliverable in this bundle depends on
    the matched set, and the matched set depends on
    matching-is-maximum-cardinality, so the realized share is total rather
    than partial.
  realized_share: 71/71
  realized_share_recomputed: >-
    Recomputed from these bytes after the sixth deliverable was added, not
    carried forward from 55/55. Nineteen compiled items carry weight 61 and two
    judged items carry weight 10, so total graded weight is 71. All four items
    over D6-contested-account depend on discovery. contested_account_structure
    requires each heading's txn_id to be a row of the statement, and the three
    rows an account can lawfully contest are fixed by which-rows-are-contestable
    rather than by the statement. contested_account_names_an_alternative
    recomputes the eligible set from environment/inputs/, which is discovery by
    construction. Both judged items read the pairing and the reason against the
    matching, so each depends on matching-is-maximum-cardinality and on
    which-rows-are-contestable. The share therefore stays total at 71/71, and
    the number changed because the denominator did.

# ---------------------------------------------------------------------------
# Item 4: mutations. Loud mutations are announced and applied; silent
# mutations are applied and never announced, and each binds to a checker and
# a stale control.
# ---------------------------------------------------------------------------
mutations:
  loud: []
  loud_note: >-
    This slot is single-turn with no admin-plane turn in which to announce a
    mutation, so no loud mutation is encoded. Item 4 requires loud mutations
    to be announced and applied; an unannounced one would be a silent
    mutation under another name.
  silent:
    - id: snapshot-staleness
      applied: >-
        The graded carrier for the reconciliation table is
        /app/out/snapshot.sql, a dump the solver produces. The verifier runs
        in a separate offline container that receives only the declared
        artifacts, so the live table is unreachable at grade time and the
        dump is the only evidence of table state. A solver that writes the
        table, dumps it, and then revises the table without redumping ships a
        snapshot that disagrees with the table it claims to represent.
      announced: false
      announced_note: >-
        instruction.md states the grader reads the file rather than the
        database and that a stale snapshot scores as if the table were
        absent. It never states that the artifact list is what makes the
        database unreachable, nor that revision-after-dump is the specific
        failure. The mechanism is unannounced; only its consequence is.
      checker: snapshot_agrees_with_reconciliation_json
      stale_control: stale-snapshot
      stale_control_note: >-
        The stale control writes a correct table and a correct JSON, then
        dumps, then mutates one row of the table without redumping. The
        checker must reject it. A checker that passes the stale control is
        inert and proves nothing about the mutation.
    - id: served-divergence
      applied: >-
        The rendered surface is graded by dialling the application the verifier
        serves, so the screens and the JSON deliverable are two independent
        renderings of one reconciliation and nothing reconciles them
        automatically. A solver that computes the answer once for its JSON and
        again for its screens, or that writes the JSON and then changes what a
        screen renders, ships a served screen disagreeing with its own
        declared result, exactly as a stale dump disagrees with its table.
      announced: false
      announced_note: >-
        instruction.md states that the screens and the JSON must agree and
        that the rendered page is what is graded. It never states that the
        grader reads them through two separate paths, nor that a late change
        to one is the specific failure. The mechanism is unannounced; only
        its consequence is.
      checker: served_screen_agrees_with_reconciliation_json
      stale_control: divergent-screen
      stale_control_note: >-
        The control serves screens rendering one row's category or policy
        state differently from the JSON that declares it. The checker must
        reject it; a checker that passes it is inert and proves nothing about
        the mutation.

# ---------------------------------------------------------------------------
# Item 9: red lines. Each is a deterministic backend-state assertion whose
# breach is catastrophic rather than incremental.
# ---------------------------------------------------------------------------
red_lines:
  - id: no-network-egress
    assertion: >-
      The solver reaches no external host. task.toml binds [agent]
      network_mode no-network and both environment baselines to no-network,
      so egress is denied by the runner rather than by inspection.
    penalty: catastrophic
  - id: inputs-unmodified
    assertion: >-
      Every byte under /app/inputs/ is unchanged at grade time. A solver that
      edits the statement, a receipt, or the policy to make its own output
      consistent has rewritten the question rather than answered it.
    penalty: catastrophic
    checker: inputs_unmodified
  - id: table-shape-exact
    assertion: >-
      The reconciliation table carries exactly the six declared columns with
      the declared types and no others, proved from the dump.
    penalty: catastrophic
    checker: snapshot_table_shape
  - id: screens-are-self-contained
    assertion: >-
      Every screen the application serves issues no request to an origin other
      than the application's own. Every stylesheet, script, font and image it
      needs is served by the application itself, so the rendered surface a
      grader measures is the one this image can produce rather than one a
      network fetch completed. Observed through browser request interception,
      which sees a URL a script composed at runtime.
    penalty: catastrophic
    checker: served_screens_request_no_external_origin

# ---------------------------------------------------------------------------
# Item 10a: known-wrong controls. Each must be rejected by the live checkers.
# ---------------------------------------------------------------------------
known_wrong_controls:
  - id: greedy-matching
    defect: >-
      Sorts eligible pairs by (amount delta, date delta, receipt_id) and takes
      the best available edge first instead of maximising matched pairs.
    expect: rejected
  - id: signed-amount-compare
    defect: >-
      Compares the receipt total against the signed amount_cents rather than
      its absolute value, so every debit row fails eligibility.
    expect: rejected
  - id: naive-colon-split
    defect: >-
      Splits each receipt line on every colon, corrupting the two VENDOR
      values that contain one.
    expect: rejected
  - id: hardcoded-policy
    defect: >-
      Hard-codes the window, tolerance and limits instead of reading
      policy.json, so it is correct only for the shipped policy.
    expect: rejected
  - id: stale-snapshot
    defect: >-
      Writes a correct table and JSON, dumps, then mutates one table row
      without regenerating the dump.
    expect: rejected
  - id: divergent-screen
    defect: >-
      Serves screens that render one row's category or policy state
      differently from the JSON deliverable that declares it.
    expect: rejected
  - id: app-never-answers
    defect: >-
      Writes every file deliverable correctly and serves nothing, so no screen
      route answers within the health deadline.
    expect: rejected
  - id: unsorted-output
    defect: >-
      Emits matched unsorted by receipt_id and the two id lists unsorted, and
      renders the table rows in that same order.
    expect: rejected
  - id: totals-drift
    defect: >-
      Emits correct lists but a violation_count that counts every matched
      pair in a limited category rather than only those strictly exceeding
      the limit.
    expect: rejected
  - id: colour-only-violation
    defect: >-
      Distinguishes a violating row by colour alone, leaving every
      policy-state cell at the same computed font weight, so the rendered
      state carries the distinction the statement requires in no text weight.
    expect: rejected
  - id: missing-detail-screens
    defect: >-
      Renders the review screen correctly and serves no per-pair detail
      screen, so half the rendered obligation is absent.
    expect: rejected
  - id: external-font-reference
    defect: >-
      References a web font by external URL, which no-network leaves
      unresolved, so every graded cell renders in a fallback the image did
      not ship.
    expect: rejected
  - id: contested-account-inverts-a-pairing
    defect: >-
      Writes /app/out/contested.md with three well-formed sections that name
      every identifier the eligible sets admit, but whose TXN-1009 section
      asserts the row was matched to RCP-0011 rather than to RCP-0008, which
      the matched array of its own reconciliation.json contradicts.
    expect: rejected
    proves: >-
      The liveness half of contested_pairing_matches_declared_matching. The
      section carries both identifiers, so every substring and token-set
      comparator over the prose accepts it; only a reading of what the sentence
      asserts rejects it. A judge that passes this control is inert, which
      Phase verify item 7e makes BLOCK:INVALID_TASK.
  - id: contested-account-gives-a-false-reason
    defect: >-
      Writes /app/out/contested.md whose pairings all agree with
      reconciliation.json, but whose TXN-1007 section gives the deciding reason
      as RCP-0011 having the smaller amount delta, when its delta is +45 cents
      against a nearer alternative and the operative rule is maximum-cardinality
      matching forcing it off its best edge.
    expect: rejected
    proves: >-
      The liveness half of contested_reason_is_the_operative_rule. The section
      speaks the vocabulary of the stated rules, so any keyword comparator
      accepts it; only a reading of whether the reason is the operative one
      rejects it. It also proves the two judged items are disjoint, because this
      control passes contested_pairing_matches_declared_matching while failing
      the reason item, and contested-account-inverts-a-pairing does the reverse.
  - id: contested-account-absent
    defect: >-
      Produces the other five deliverables correctly and writes no
      /app/out/contested.md at all.
    expect: rejected
    proves: >-
      That both judged items and both compiled contested items fail closed on an
      absent carrier rather than scoring vacuously, which is the same fail-closed
      property app-never-answers proves for the served application.
  - id: policy-notes-inverts-the-relation
    defect: >-
      Produces every deliverable correctly except that the RCP-0005 section of
      /app/out/policy-notes.md reads "8100 does not exceed 7500, so the pair
      does not violate policy", leaving the section set, the heading order, the
      receipt total and the governing cap exactly as the oracle writes them.
    expect: rejected
    proves: >-
      The liveness half of policy_verdict_follows_from_the_two_numbers, and the
      residue that makes it judged. Measured by execution: both compiled items
      over this carrier return True on these bytes, because both integers occur
      and the cited cap is the one governing the receipt's own category. Only a
      reading of whether 8100 exceeds 7500 separates it from the oracle, so a
      criterion that accepts both is inert under item 7e and the item must be
      judged rather than compiled.
  - id: policy-notes-cites-the-wrong-limit
    defect: >-
      Produces every deliverable correctly except that the RCP-0005 section
      cites the travel limit of 50000 cents against a meals receipt, while
      still reaching the verdict /app/out/reconciliation.json declares.
    expect: rejected
    proves: >-
      The liveness of policy_notes_names_the_governing_limit, and its
      divergence from policy_notes_covers_every_violation. Measured by
      execution: coverage returns True and limit-naming returns False on these
      bytes. A verdict that happens to agree with the JSON does not excuse a
      citation of a cap that does not govern the pair.
  - id: policy-notes-omits-a-violation
    defect: >-
      Produces /app/out/policy-notes.md with the RCP-0008 section removed, so
      one matched pair the JSON marks violates_policy true gets no account.
    expect: rejected
    proves: >-
      The liveness of policy_notes_covers_every_violation, and its divergence
      from policy_notes_names_the_governing_limit in the opposite direction.
      Measured by execution: coverage returns False and limit-naming returns
      True, because every remaining section still cites its own governing cap.
      Together with policy-notes-cites-the-wrong-limit this proves each of the
      two compiled items fails on a defect the other passes.
  - id: policy-notes-absent
    defect: >-
      Produces the other six deliverables correctly and writes no
      /app/out/policy-notes.md at all.
    expect: rejected
    proves: >-
      That both compiled items over this carrier and the judged item fail
      closed on an absent file rather than scoring vacuously. Measured by
      execution: both compiled items return False.
  - id: policy-notes-falsifies-the-magnitude
    defect: >-
      Produces every deliverable correctly except that the RCP-0005 section of
      /app/out/policy-notes.md reads "8100 strictly exceeds 7500, by 2400
      cents, so the pair violates policy". The relation is correct, the verdict
      is correct, both integers are present, the section set and heading order
      are the oracle's, and only the stated difference is false: 8100 minus
      7500 is 600.
    expect: rejected
    proves: >-
      The liveness half of policy_magnitude_is_the_arithmetic_difference, and
      the residue that makes it judged. Measured by execution against the whole
      compiled surface over every prose carrier:
      policy_notes_covers_every_violation,
      policy_notes_names_the_governing_limit, contested_account_structure,
      contested_account_names_an_alternative, parse_notes_covers_every_hazard
      and parse_notes_quotes_the_correct_value all returned True on these
      bytes. A second variant falsifying the non-violating shortfall from 1800
      to 9900 returned True on all six as well. So no compiled item in this
      bundle separates a true subtraction from a false one.
    distinguished_from: >-
      This control leaves policy_verdict_follows_from_the_two_numbers
      satisfiable, because the relation it asserts and the verdict it reaches
      are both the ones the numbers compel. That is the disjointness proof for
      the two judged items of D7-policy-rationale by process: this control
      falsifies exactly one of the pair.
    not_caught_by_a_comparator: >-
      Tested rather than assumed, because the magnitude is the difference of
      two integers a compiled item already locates and a reduction would have
      made the judged item BLOCK:INVALID_TASK under item 7e. The strongest
      reasonable comparator, binding a "by N cents" phrase in a section and
      requiring N to equal the absolute difference of that section's two
      numbers, does return False on this control in the oracle's exact wording.
      It returns True on the same false claim phrased "exceeding it by 2400",
      "with a difference of 2400 cents", "2400 cents over", and on the figure
      spelled in words. instruction.md prescribes no wording for the figure and
      states that no length is prescribed, so a comparator that works only
      where the solver copies the oracle's sentence shape reduces the oracle
      rather than the judgment.
  - id: parse-notes-misattributes-the-colon-mechanism
    defect: >-
      Produces every deliverable correctly except that the RCP-0003 and
      RCP-0007 sections of /app/out/parse-notes.md claim the trailing-non-field
      lines rule instead of the colon rule, while still quoting each receipt's
      true VENDOR value and the truncation a naive split would produce. Neither
      receipt carries a non-field line.
    expect: rejected
    proves: >-
      The liveness half of parse_notes_attributes_the_colon_mechanism, and the
      residue that makes it judged. Measured by execution: on these bytes
      parse_notes_covers_every_hazard returns True and
      parse_notes_quotes_the_correct_value returns True, because the heading
      set is untouched and every string either checker requires survives the
      swap. Only a reading of which rule each section attributes separates this
      carrier from the oracle, so a criterion that accepts both is inert under
      item 7e and the item must be judged.
    distinguished_from: >-
      This control leaves the RCP-0004 section correct, so
      parse_notes_attributes_the_nonfield_mechanism must accept it while
      parse_notes_attributes_the_colon_mechanism rejects it. That is one half
      of the disjointness proof for the two judged items of
      D8-parse-rationale by process.
  - id: parse-notes-misattributes-the-nonfield-mechanism
    defect: >-
      Produces every deliverable correctly except that the RCP-0004 section of
      /app/out/parse-notes.md claims the colon rule instead of the
      trailing-non-field lines rule, while still quoting its true VENDOR value
      'Carter & Voss LLP' and both of its non-field lines verbatim. Its VENDOR
      value carries no colon.
    expect: rejected
    proves: >-
      The liveness half of parse_notes_attributes_the_nonfield_mechanism.
      Measured by execution: on these bytes parse_notes_covers_every_hazard
      returns True and parse_notes_quotes_the_correct_value returns True,
      because for a receipt whose VENDOR carries no colon the quoting item
      requires the true vendor and every non-field line, all of which this
      carrier still holds. The receipt's own bytes contradict the rule the
      prose attributes to it and no comparator over the prose detects that.
    distinguished_from: >-
      This control leaves the RCP-0003 and RCP-0007 sections correct, so
      parse_notes_attributes_the_colon_mechanism must accept it while
      parse_notes_attributes_the_nonfield_mechanism rejects it. Together with
      parse-notes-misattributes-the-colon-mechanism this is the disjointness
      proof item 7e requires of two judged items in one cell: each control
      fails exactly one of the pair.
  - id: parse-notes-omits-a-hazardous-receipt
    defect: >-
      Produces /app/out/parse-notes.md with the RCP-0004 section removed, so a
      receipt carrying non-field lines gets no account.
    expect: rejected
    proves: >-
      The liveness of parse_notes_covers_every_hazard and its divergence from
      parse_notes_quotes_the_correct_value. Measured by execution: coverage
      returns False and quoting returns True, because the two remaining
      sections still carry every string the quoting item requires.
  - id: parse-notes-discusses-a-clean-receipt
    defect: >-
      Produces /app/out/parse-notes.md with a fourth section for RCP-0001,
      whose VENDOR carries no colon and which has no non-field lines, so the
      account discusses a receipt the statement forbids discussing.
    expect: rejected
    proves: >-
      That the statement's prohibition on discussing a receipt whose bytes
      exercise neither rule is enforced by membership rather than inferred.
      Measured against current bytes in both placements: appended after
      RCP-0007 and inserted in ascending position before RCP-0003, coverage
      returns False either way while quoting returns True, so the defect is the
      surplus member and not the ordering.
  - id: parse-notes-misquotes-the-correct-value
    defect: >-
      Produces /app/out/parse-notes.md with every section present, ordered and
      correctly attributed, but with the quoted correct VENDOR values mangled.
    expect: rejected
    proves: >-
      The liveness of parse_notes_quotes_the_correct_value against something
      other than absence, which item 7e requires because a criterion that
      fails only on a missing carrier is inert. Measured by execution: coverage
      returns True and quoting returns False, the opposite direction from
      parse-notes-omits-a-hazardous-receipt, which completes the exclusivity
      proof for the two compiled items.
  - id: parse-notes-absent
    defect: >-
      Produces the other seven deliverables correctly and writes no
      /app/out/parse-notes.md at all.
    expect: rejected
    proves: >-
      That both compiled items over this carrier and both judged items fail
      closed on an absent file rather than scoring vacuously. Measured by
      execution: both compiled items return False.
  - id: convention-notes-inverts-the-collapse
    defect: >-
      Produces every deliverable correctly except that the collapse section of
      /app/out/convention-notes.md is inverted: it reads that the
      absolute-value rule admits one eligible pair and the signed comparison
      twelve, that the maximum matching holds one pair under the absolute rule
      and eleven under the signed one so dropping the absolute value would gain
      ten pairs, and that RCP-0011 to TXN-1007 is the pair the signed
      comparison drops. Every figure and identifier the oracle names is still
      present and the divergence section is untouched.
    expect: rejected
    proves: >-
      The liveness half of convention_collapse_is_the_true_direction, and the
      residue that makes it judged. Measured by execution against the whole
      compiled surface: all eight compiled items over every prose carrier
      returned True on these bytes. Only a reading of which rule each figure is
      attached to, and of which direction the loss runs, separates this carrier
      from the oracle, so a criterion accepting both is inert under item 7e and
      the item must be judged rather than compiled.
    distinguished_from: >-
      This control leaves the divergence section exactly as written, so
      convention_divergence_set_is_the_true_partition is left satisfiable. That
      is one half of the disjointness argument for the two judged items of
      D9-convention-divergence-rationale by process, and it is an argument from
      what the control alters rather than a measured verdict, since no judge has
      run.
  - id: convention-notes-claims-the-rules-agree
    defect: >-
      Produces every deliverable correctly except that the divergence section
      of /app/out/convention-notes.md asserts that no row differs between the
      two rules and that the two rules agree on every row, TXN-1007 and
      TXN-1011 included, while still naming all twelve txn_ids. The collapse
      section is untouched, so the account simultaneously says that dropping
      the absolute value costs ten matched pairs and that no row's eligible set
      changes.
    expect: rejected
    proves: >-
      The liveness half of convention_divergence_set_is_the_true_partition.
      Measured by execution: all eight compiled items returned True on these
      bytes, because convention_notes_names_every_row is a membership test over
      the section's txn_id tokens and every token is still present. The
      assignment of a named row to the wrong group is invisible to it, which is
      the residue stated as a measurement.
    distinguished_from: >-
      This control leaves the collapse section exactly as written, so
      convention_collapse_is_the_true_direction is left satisfiable. Together
      with convention-notes-inverts-the-collapse it is the disjointness
      argument item 7e requires of two judged items in one cell: each control
      corrupts the subject of exactly one of the pair. Argued from the control
      design rather than executed, since a judge is required to execute a
      judged item and none has run.
  - id: convention-notes-states-only-the-general-shape
    defect: >-
      Produces /app/out/convention-notes.md with both sections and a correct
      collapse, but with the divergence section's ten row names replaced by the
      phrase "the debit rows" and the coinciding pair left unnamed.
    expect: rejected
    proves: >-
      The liveness of convention_notes_names_every_row against something other
      than absence, which item 7e requires because a criterion failing only on
      a missing carrier is inert. Measured by execution:
      convention_notes_names_every_row returns False while
      convention_notes_carries_both_sections returns True, which is also the
      exclusivity divergence between the two compiled items of this obligation.
      It is the defect instruction.md names directly when it says an account
      stating only the general shape cannot be checked against these inputs.
  - id: convention-notes-absent
    defect: >-
      Produces the other eight deliverables correctly and writes no
      /app/out/convention-notes.md at all.
    expect: rejected
    proves: >-
      That both compiled items over this carrier and both judged items fail
      closed on an absent file rather than scoring vacuously. Measured by
      execution: both compiled items return False while every compiled item
      over the other prose carriers still returns True, so the failure is
      confined to this obligation.
  - id: no-op
    defect: Produces no deliverable at all.
    expect: rejected

# ---------------------------------------------------------------------------
# Item 10a: sentinel cases the checker must pass and malformed cases it must
# fail, proving each checker fires on both halves.
# ---------------------------------------------------------------------------
sentinels:
  - id: reference
    kind: must-pass
    note: The reference solution derived from this file.
malformed:
  - id: json-not-object
    kind: must-fail
    note: reconciliation.json holding a JSON array instead of an object.
  - id: summary-extra-whitespace
    kind: must-fail
    note: summary.txt with trailing whitespace on a line.
  - id: snapshot-absent
    kind: must-fail
    note: snapshot.sql missing while the other three deliverables are correct.
  - id: app-unreachable
    kind: must-fail
    note: >-
      no route answers within the health deadline while every file deliverable
      is correct.
  - id: served-row-count-wrong
    kind: must-fail
    note: a review screen rendering one fewer matched row than the JSON declares.
  - id: contested-account-token-stuffed
    kind: must-fail
    note: >-
      contested.md whose three sections name every identifier the eligible sets
      admit and nothing else, with no sentence asserting any pairing or reason.
      It satisfies both compiled contested items and must fail both judged ones,
      which is the sharpest statement of the residue: the carrier's tokens are
      right and its claims are absent.

# ---------------------------------------------------------------------------
# Item 10f / 8: the checker set. Each reduces to exactly one outcome class.
# Every item here is mode compiled: each judgment below is deterministically
# reducible over its named evidence, and item 10f makes mode judged never an
# authoring choice for such a judgment. The judged items are authored in a
# later pass, after the drafting acceptance predicate binds.
# ---------------------------------------------------------------------------
checkers:
  - id: reconciliation_json_wellformed
    outcome_class: VALUE
    weight: 3
    criterion: >-
      /app/out/reconciliation.json parses as one JSON object carrying exactly
      the keys matched, unreceipted, unposted and totals, with matched a list
      of objects each carrying exactly receipt_id, txn_id, amount_delta_cents,
      date_delta_days, category and violates_policy.
  - id: matched_set_exact
    outcome_class: VALUE
    weight: 5
    criterion: >-
      The matched array equals the maximum-cardinality matching the policy and
      corpus determine, pair for pair, including each amount_delta_cents and
      date_delta_days.
  - id: matched_sorted_by_receipt_id
    outcome_class: ORDERING
    weight: 1
    criterion: The matched array is sorted by receipt_id ascending.
  - id: unreceipted_set_exact
    outcome_class: VALUE
    weight: 3
    criterion: >-
      unreceipted equals the set of txn_id values with no matched receipt,
      sorted ascending.
  - id: unposted_set_exact
    outcome_class: VALUE
    weight: 3
    criterion: >-
      unposted equals the set of RECEIPT-ID values with no matched row, sorted
      ascending.
  - id: violation_flags_exact
    outcome_class: VALUE
    weight: 3
    criterion: >-
      Each matched pair's violates_policy is true exactly when its category
      appears in category_limits_cents and its total in cents strictly exceeds
      that limit.
  - id: totals_consistent
    outcome_class: INVARIANT
    weight: 3
    criterion: >-
      Each count in totals equals the length of the list it describes, and
      violation_count equals the number of matched pairs with violates_policy
      true.
  - id: summary_matches_json
    outcome_class: DIVERGENCE
    weight: 3
    criterion: >-
      summary.txt carries exactly four lines in the declared order whose
      numbers equal the corresponding totals in reconciliation.json, with no
      leading or trailing whitespace and exactly one space after each colon.
  - id: snapshot_table_shape
    outcome_class: INVARIANT
    weight: 3
    criterion: >-
      snapshot.sql shows a reconciliation relation carrying exactly the six
      declared columns and no others.
  - id: snapshot_agrees_with_reconciliation_json
    outcome_class: DIVERGENCE
    weight: 5
    criterion: >-
      Every row in snapshot.sql corresponds to exactly one entry of the
      matched array with identical field values, and the row count equals
      matched_count, so a stale dump is rejected.
  - id: inputs_unmodified
    outcome_class: ABSENCE
    weight: 5
    criterion: >-
      No byte under /app/inputs/ differs from the bytes the image shipped.
  - id: review_screen_structure
    outcome_class: VALUE
    weight: 3
    criterion: >-
      The review screen the application serves at / carries the elements
      matched-table, unreceipted-list, unposted-list, totals-matched,
      totals-unreceipted, totals-unposted and totals-violations, with
      matched-table holding one row per matched pair, each carrying a
      data-receipt-id attribute and exactly six cells.
  - id: review_screen_rows_sorted
    outcome_class: ORDERING
    weight: 1
    criterion: >-
      The data-receipt-id attributes of the matched-table rows, read top to
      bottom, are in ascending order.
  - id: review_screen_columns_aligned
    outcome_class: INVARIANT
    weight: 1
    criterion: >-
      Within matched-table, every cell of one column shares a left edge with
      every other cell of that column to within one device-independent pixel at
      the 1280 by 800 viewport.
  - id: served_screen_agrees_with_reconciliation_json
    outcome_class: DIVERGENCE
    weight: 5
    criterion: >-
      Every matched-table row the served review screen renders corresponds to
      exactly one entry of the matched array with identical receipt id, txn id,
      amount delta, date delta, category and policy state, the row count equals
      matched_count, and the four totals elements and two id lists equal their
      JSON counterparts, so a served screen diverging from its own declared
      result is rejected.
  - id: detail_screens_complete
    outcome_class: VALUE
    weight: 3
    criterion: >-
      The application serves one detail screen per matched pair at
      /pair/<receipt_id>, each returning 200 and carrying pair-receipt-id,
      pair-txn-id, pair-amount-delta, pair-date-delta, pair-category and
      pair-policy-state whose values equal that pair's entry in the matched
      array.
  - id: served_screens_request_no_external_origin
    outcome_class: ABSENCE
    weight: 5
    criterion: >-
      Loading the review screen and every detail screen issues no browser
      request to an origin other than the application's own, observed through
      request interception so a URL composed at runtime is seen, and so every
      asset the rendered surface needs is served by the application itself.
  - id: contested_account_structure
    outcome_class: VALUE
    weight: 3
    mode: compiled
    criterion: >-
      /app/out/contested.md carries exactly three sections, each opening with a
      line of the form "## <txn_id>" whose txn_id is a row of
      environment/inputs/statement.csv, the three txn_id values are distinct,
      and each section's body carries at least one non-blank prose line.
  - id: contested_account_names_an_alternative
    outcome_class: COVERAGE
    weight: 3
    mode: compiled
    criterion: >-
      Every section of /app/out/contested.md whose txn_id has an admissible
      receipt besides the one the matched array of
      /app/out/reconciliation.json pairs it with names at least one of those
      further receipts, at least one section is such a section, and the
      admissible set is recomputed from environment/inputs/ rather than read
      from the prose.
    criterion_prior_recording: >-
      Supersedes a frozen prose that read "Each section ... names ... at least
      one further RECEIPT-ID or txn_id drawn from the eligible set". That
      quantifier was universal over all three sections and no correct
      deliverable could satisfy it, because the corpus gives exactly one row a
      losing alternative. Measured by executing this checker against the
      oracle's own /app/out/contested.md: the three sections resolve to
      admissible sets {RCP-0008, RCP-0011} for TXN-1009 with partner RCP-0008
      and others {RCP-0011}, {RCP-0011} for TXN-1007 with partner RCP-0011 and
      others empty, and the empty set for TXN-1011 which matched nothing, so
      two of three sections had nothing to name and the item returned False
      while contested_account_structure returned True on the same bytes. The
      quantifier is now conditional on the row having an alternative, and the
      second conjunct keeps it from passing vacuously on three rows that have
      none. Recorded under named gap contested-alternative-item-unsatisfiable,
      which closes on this repair.
    mode_source: >-
      Authored compiled rather than judged after an explicit ruling. The
      eligible set is recomputable from the corpus and membership of a token in
      that set is decidable over the prose bytes, so item 10f's clause that a
      deterministically reducible judgment "must use mode compiled" and that
      "mode judged is never an authoring choice for it" applies. The weaker
      residual claim, whether the prose asserts that receipt as an alternative
      rather than merely naming it, is not this criterion and is not authored
      as one; solution/grounding.yaml records the ruling under
      judged_candidates as contested-alternative-is-claimed-as-such.
  - id: policy_notes_covers_every_violation
    outcome_class: COVERAGE
    weight: 5
    mode: compiled
    criterion: >-
      /app/out/policy-notes.md carries one section per receipt_id that the
      matched array of /app/out/reconciliation.json marks violates_policy true,
      those sections stand first in ascending receipt_id order, exactly one
      further section names a receipt_id the same array marks violates_policy
      false, every heading is distinct and of the form "## <receipt_id>", and
      every section body carries at least one non-blank line.
    mode_source: >-
      Compiled rather than judged, because which receipts violate is a
      reference value /app/out/reconciliation.json already declares and
      membership of a heading in that set is decidable over the prose bytes.
      Item 10f's clause that a deterministically reducible judgment "must use
      mode compiled" applies, and the residual claim about what each section
      asserts is authored separately as a judged item rather than folded in
      here.
    weight_source: >-
      Weighted 5 rather than 3 because its failure costs the obligation its
      whole subject: a missing section is a policy decision the account never
      makes, and the deliverable exists to account for every violation. By
      contrast contested_account_structure is weighted 3, because the three
      contested rows are the solver's own choice and no particular row is owed.
  - id: policy_notes_names_the_governing_limit
    outcome_class: VALUE
    weight: 3
    mode: compiled
    criterion: >-
      Each section of /app/out/policy-notes.md carries its receipt's TOTAL in
      cents and the category_limits_cents value policy.json sets for that
      receipt's own CATEGORY, carries no limit value policy.json sets for a
      different category, and where the category appears in no limit carries no
      limit value at all, with every value recomputed from environment/inputs/
      rather than read from the prose.
    mode_source: >-
      Compiled rather than judged. Both the receipt total and the governing cap
      are reference values recomputable from environment/inputs/, and whether a
      section carries the one that governs it rather than a neighbouring
      category's is decidable over the prose bytes by comparing the integers it
      contains against the limits table. The claim this cannot settle, whether
      the stated relation between those two numbers is the one that holds, is
      authored as the judged item policy_verdict_follows_from_the_two_numbers.
    weight_source: >-
      Weighted 3 rather than 5. Its failure is a wrong citation inside an
      otherwise complete account, which misleads a reviewer without removing a
      decision, whereas policy_notes_covers_every_violation at 5 loses the
      decision entirely.
  - id: parse_notes_covers_every_hazard
    outcome_class: COVERAGE
    weight: 5
    mode: compiled
    criterion: >-
      /app/out/parse-notes.md carries exactly one section per receipt in
      environment/inputs/receipts/ whose VENDOR value contains a colon or which
      carries a line that is not a field line, the headings are those
      receipt_ids in ascending order and no others, and every section body
      carries at least one non-blank line, with the hazardous set recomputed
      from the receipt bytes rather than read from the prose.
    mode_source: >-
      Compiled rather than judged. Which receipts carry a hazard is decidable
      over environment/inputs/receipts/ by the two rules the statement states,
      and heading membership in that recomputed set is decidable over the prose
      bytes, so item 10f's clause that a deterministically reducible judgment
      must use mode compiled applies. The claim this cannot settle, which
      mechanism the prose attributes to each receipt, is authored as the two
      judged items over this obligation.
    weight_source: >-
      Weighted 5 against item 9g's test. A missing section is a hazardous
      receipt the account never discusses, and a surplus section discusses a
      receipt the statement forbids discussing, so either failure means the
      account does not describe the set the obligation names. Measured in both
      directions: dropping the RCP-0004 section returns False, and adding a
      section for RCP-0001, which carries neither hazard, returns False whether
      appended or placed in ascending position.
  - id: parse_notes_quotes_the_correct_value
    outcome_class: VALUE
    weight: 3
    mode: compiled
    criterion: >-
      Each section of /app/out/parse-notes.md carries its receipt's correct
      VENDOR value under the first-colon-only rule, and additionally carries
      the truncated value a split-on-every-colon parse would produce where the
      receipt's VENDOR contains a colon, or every one of its non-field lines
      where it does not, with every value recomputed from the receipt bytes
      rather than read from the prose.
    mode_source: >-
      Compiled rather than judged. The correct vendor value, the truncation a
      naive split yields, and the non-field lines are all reference values
      recomputable from the receipt bytes, and whether a section carries those
      strings is decidable over the prose bytes. What this cannot settle is
      which mechanism the section attributes to the receipt, because the
      strings it requires survive an attribution swap untouched, which is
      measured under the two judged items' residues.
    weight_source: >-
      Weighted 3 against item 9g's test. Its failure is a misquotation inside
      an account whose section set and attributions may be right, so a reviewer
      still learns which receipts are hazardous and which rule governs each and
      is misled only about the literal value. That is substantial but partial
      credit, below parse_notes_covers_every_hazard at 5 where the set itself
      is wrong. Liveness measured independently of absence: mangling the quoted
      vendor values returns False while the section set stays correct.
  - id: convention_notes_carries_both_sections
    outcome_class: VALUE
    weight: 3
    mode: compiled
    criterion: >-
      /app/out/convention-notes.md carries exactly two sections, the first
      headed "## collapse" and the second "## divergence" in that order and
      with no other heading, and each section body carries at least one
      non-blank line.
    mode_source: >-
      Compiled rather than judged. The statement fixes both headings and their
      order as literals, so whether the carrier holds them is decided by a
      comparison over its own bytes and item 10f's clause that a
      deterministically reducible judgment must use mode compiled applies. What
      this cannot decide is whether either section's claims are true, which the
      two judged items over this obligation grade.
    weight_source: >-
      Weighted 3 against item 9g's test, which sets 3 where failing the item
      costs substantial but partial credit. A carrier missing the divergence
      section loses half the account, which is substantial; a carrier holding
      both sections in the wrong order or under a third heading still carries
      both bodies and a reader can follow it. Neither failure destroys the
      obligation the way a false claim does, so it sits below both judged items
      and below convention_notes_names_every_row, whose failure removes the
      checkable content rather than its container.
  - id: convention_notes_names_every_row
    outcome_class: COVERAGE
    weight: 5
    mode: compiled
    criterion: >-
      The divergence section of /app/out/convention-notes.md names every txn_id
      of environment/inputs/statement.csv whose eligible receipt set differs
      between the absolute-value rule and the signed comparison, and every
      txn_id whose set is the same under both, where both sets are recomputed
      from environment/inputs/ rather than read from the prose.
    mode_source: >-
      Compiled rather than judged. Both partitions are recomputable from the
      shipped corpus by building the eligibility graph twice, and whether a
      txn_id token appears in the divergence section is decidable over the
      prose bytes, so the judgment reduces and item 10f forbids mode judged for
      it. The claim it cannot settle is which partition the prose assigns each
      named row to, which is authored as
      convention_divergence_set_is_the_true_partition.
    weight_source: >-
      Weighted 5 against item 9g's test, which sets 5 where failing the item
      alone fails its obligation. The statement's own words are that an account
      stating only the general shape "cannot be checked against these inputs",
      so naming the rows is the obligation rather than an adornment of it.
      Measured: a carrier replacing the ten row names with the phrase "the
      debit rows" returns False here while
      convention_notes_carries_both_sections returns True, so the failure is
      the loss of every checkable claim in the section while its container
      stands.

# ---------------------------------------------------------------------------
# Item 10f: the judged items. Kept in their own block rather than beside the
# compiled checkers because solution/recompute.py iterates the checkers block
# to emit tests/test_output.py, and a judged item emitted as a Reward Kit
# criterion would be graded by a comparator that cannot settle it. Each item
# here is emitted to tests/judge.toml instead, and every field this block
# carries is one item 10f names.
# ---------------------------------------------------------------------------
judged_items:
  note: >-
    Five items at mode judged, over three obligations and three cells: two in
    D6-contested-account by process, one in D7-policy-rationale by process, and
    two in D8-parse-rationale by process. Each reads a written prose carrier no
    item of any other cell reads, so no judged item overlaps a compiled one and
    no judged item of one cell can collide with one of another.

    Item 7e scopes exclusivity per cell, "no two judged items of one cell state
    the same check", which is a distinctness requirement and not a count, so a
    cell admits as many items as there are distinct defects. Each cell carrying
    two items argues its pair disjoint from the design of its shipped controls
    rather than from execution, since a judge is required to execute a judged
    item and no judge has run against this bundle; the grid note for each
    records which control corrupts the subject of which item. What execution
    does establish for every one of those controls is that the whole compiled
    surface accepts it, which is the residue and is recorded as measured.

    Corrected form. An earlier revision of this note said those cells "prove
    their pair disjoint by execution rather than by argument", which overstated
    what was done and contradicted the honest form the D6 exclusivity record
    already carried. The overstatement is named rather than quietly narrowed.

    Supersedes an earlier note recording two items in one cell. That note was
    true of the surface it described and its disjointness argument for the D6
    pair stands unchanged: an account naming the wrong partner while giving a
    sound general reason fails the first and can pass the second, and an
    account naming the right partner while attributing it to closeness fails
    the second and passes the first.
  judge:
    backend: claude-code
    model: anthropic/claude-fable-5
    version: 2.1.314
    cwd: /app
    mode: individual
    backend_source: >-
      Measured rather than preferred. Reward Kit routes a [judge] value naming a
      known agent through its agent-judge backend, which execs that agent's CLI,
      and any other value through the LLM backend, which calls the Anthropic
      messages endpoint over HTTP. The two are not interchangeable against the
      credential this bundle is graded with. task.toml [verifier.env] carries
      CLAUDE_CODE_OAUTH_TOKEN, a subscription sk-ant-oat token, and the same
      token on the same host 35 seconds apart was refused by the plain endpoint
      with a rate_limit_error and accepted by the CLI, which returned the
      requested string. A factorial probe over an identity preamble and a
      json_schema response_format failed in all eight cells, so the refusal is
      the transport rather than the request shape or an exhausted quota. The LLM
      backend therefore cannot grade this bundle at all, which is why the backend
      is a source value here rather than the field being left to default.
    version_source: >-
      The CLI is not fetchable at grade time: [verifier] runs under an allowlist
      that admits api.anthropic.com alone, and _ensure_claude_installed would
      otherwise curl an installer. tests/Dockerfile therefore bakes exactly this
      release, selected by explicit TARGETARCH against its published sha256, and
      asserts it in both the stage that builds it and the stage that ships it.
      Pinning the same value here makes rewardkit's _matching_binary accept the
      baked binary rather than install over it, and sets DISABLE_UPDATES.
    cwd_source: >-
      AgentJudge carries no files field, and rewardkit's prompts/agent.md tells
      the judge to explore its working directory, so the per-criterion files
      lists the eight items declare are reachable only if the judge starts in the
      workspace the deliverables are restored into. That is /app, which
      rewardkit's own --workspace default also names.
    isolated_source: >-
      Not emitted, so it defaults false, and tests/test.sh passes --yolo to
      accept the resulting shared-workspace warning. isolated = true is the
      documented alternative and is unavailable here: it mounts overlayfs, which
      the unprivileged verifier container cannot do, and rewardkit fails the
      whole reward rather than degrading. The exposure the warning names is
      bounded, because Harbor collects every artifact before the verifier starts
      and each criterion reads named paths rather than enumerating the tree.
    mode_source: >-
      Forced by the carrier's own shape rather than chosen, which is why it is a
      generated consequence rather than an authored preference. Every one of the
      eight judged items carries its own files list and the [judge] table
      declares no files key, so Reward Kit's JudgeConfig.files resolves empty.
      reward.py lines 211 to 217 then refuse the combination: "if
      self.judge.mode == \"batched\": if c.files and isinstance(self.judge,
      (LLMJudge, JevJudge)): raise ValueError(... per-criterion 'files' requires
      the judge to use mode = \"individual\". Set the mode or remove the
      criterion-level files.)". JudgeMode at models.py line 274 is
      Literal["batched", "individual"] and JudgeConfig.mode defaults to
      "batched" at line 320, so exactly one admitted value satisfies this
      carrier and no operator choice selects it.
    mode_why_not_removing_the_files_lists: >-
      The validator names two remedies and only one preserves the evidence.
      judges.py line 435 passes judge.files on the batched path and never reads
      c.files, while line 458 on the individual path passes "c.files or
      judge.files". With judge.files empty, batched would grade all eight
      criteria against no evidence at all, which is exactly the silent loss the
      validator exists to prevent. Removing the per-criterion files lists
      therefore realizes that loss rather than avoiding it, and it would weaken
      eight criteria to satisfy a tool, which rules.md rule 6 and the operator's
      own Part E.1 feedback both forbid.
    mode_cost_not_semantics: >-
      judges.py _arun_llm_individual at lines 443 to 472 fans the criteria out
      concurrently under one asyncio.TaskGroup, one call per criterion, slicing
      weights per criterion at line 457 and concatenating the scores at line
      468. So the eight criteria grade on the same evidence each one names, and
      the change is from one model call to eight. That is a cost change rather
      than a semantics change, and the operator accepted the cost explicitly.
    model_source: >-
      Named by the operator for this bundle, which is the source value item 10f
      conditions emission on: "omit [judge] unless a source value exists". The
      clause turns on a source value existing rather than on its being derived
      from the grounding, and this is where such a value is retained so
      solution/recompute.py emits the table rather than a hand edit asserting
      it.
    model_requested: >-
      The operator asked for Fable 5.1. That request is recorded here with the
      substitution rather than silently resolved, because the shipped value is
      Fable 5 and a reader comparing the two must see which was asked for.
    model_substitution_reason: >-
      Both forms route identically: litellm get_llm_provider resolves
      anthropic/claude-fable-5 and anthropic/claude-fable-5-1 alike to provider
      anthropic, and rewardkit judges _is_anthropic_direct_model admits both, so
      either reaches the subscription token path. They differ on cost data under
      the flag this bundle itself sets. tests/../task.toml [verifier.env]
      carries LITELLM_LOCAL_MODEL_COST_MAP = "True", which makes litellm load
      its bundled backup map rather than the live one. Measured: the live
      default map holds 4429 entries including claude-fable-5-1, while the same
      map under that flag holds 2953 and claude-fable-5-1 is absent from it
      whereas claude-fable-5 is present with input_cost_per_token 1e-05. An
      absent key is not fatal, since get_model_info still returns a record,
      but it returns input_cost_per_token 0, so a 5-1 pin would grade correctly
      and report judge cost as zero in every pilot run. Fable 5 is therefore the
      only Fable form that keeps cost accounting honest under this bundle's own
      configuration.
    model_repin_is_a_separate_edit: >-
      A later Harbor or litellm release whose cost map carries a Fable 5.1 entry
      under the local-cost-map flag makes the 5.1 pin lossless, and moving to it
      is a separate deliberate edit that re-mints this bundle. It is not implied
      by this record and no future value is pre-authorized here.
    emitted_fields: >-
      Five: judge, model, version, mode and cwd. Reward Kit's JudgeConfig is
      declared extra="forbid" and carries thirteen fields: judge, model,
      version, files, mode, timeout, reasoning_effort, isolated, cwd,
      reference, atif_trajectory, mcp_servers and weight. The five emitted are
      the five this record retains a source value for, each under its own
      _source key above. The remaining eight are not emitted: files would
      override the per-criterion lists the eight items declare, isolated is
      addressed under isolated_source, and no source value exists for timeout,
      reasoning_effort, reference, atif_trajectory, mcp_servers or weight.
  items:
  - id: contested_pairing_matches_declared_matching
    outcome_class: DIVERGENCE
    weight: 5
    negate: false
    obligation: D6-contested-account
    dimension: process
    evaluation_target: /app/out/contested.md
    evidence:
      - /app/out/contested.md
      - /app/out/reconciliation.json
    criterion: >-
      In each section of /app/out/contested.md, the prose asserts for that
      section's txn_id the same receipt pairing that the matched array of
      /app/out/reconciliation.json declares for it, or asserts that the row was
      matched to no receipt where that array carries none, judged as what the
      sentences claim rather than which identifiers they contain.
    residue: >-
      What blocks compilation is predication, not vocabulary. The pairing this
      criterion checks is itself a reference value a comparator settles over
      /app/out/reconciliation.json, so the comparison is deterministic wherever
      the claim is already structured. The carrier is free English prose, and a
      comparison over the bytes of that carrier decides only whether an
      identifier occurs in a section, never what the sentence containing it
      asserts. A section reading "TXN-1009 was not matched to RCP-0008; it went
      to RCP-0011" carries both identifiers and states the opposite of the
      matched array, so every substring, regular-expression and token-set
      comparator over the prose accepts it while the claim is false. Reducing
      the check to whether the identifiers co-occur would grade whether the
      account mentions the pairing rather than whether it states it, which is a
      weaker claim than the criterion makes; reducing it to the JSON instead
      would grade the matching, which eight compiled items already do, and not
      the account. The item therefore stays judged against a written document,
      which is why the bundle declares a judged carrier under item 10f.
    weight_source: >-
      Weighted 5 against item 9g's test, which sets 5 where failing the item
      alone fails its obligation. D6-contested-account exists to produce an
      account of three disputed rows that a reviewer can check against the
      inputs. A section asserting a pairing the solver's own
      /app/out/reconciliation.json contradicts is not a partially useful
      account of that row, it is a false one: a reviewer acting on it would
      look for a pair the run never made. Failing this item alone therefore
      fails the obligation, and no partial credit survives it.
  - id: contested_reason_is_the_operative_rule
    outcome_class: VALUE
    weight: 3
    negate: false
    obligation: D6-contested-account
    dimension: process
    evaluation_target: /app/out/contested.md
    evidence:
      - /app/out/contested.md
      - environment/inputs/statement.csv
      - environment/inputs/receipts/
      - environment/inputs/policy.json
    criterion: >-
      In each section of /app/out/contested.md, the reason the prose gives for
      resolving that txn_id as it did is a reason the shipped inputs make true
      for that row under the stated matching rules, rather than a different
      rule that happens to name the same quantities.
    residue: >-
      Whether a stated reason is the operative one is not a property of the
      tokens the prose carries. The decisive case is in the shipped corpus: the
      maximum-cardinality rule routes RCP-0011 to TXN-1007 at an amount delta
      of +45 cents while a nearer edge existed, so an account reading "RCP-0011
      took TXN-1007 because its amount delta was smaller" states a reason the
      inputs make false, using the vocabulary of the rules a keyword comparator
      would look for. Every comparator over the carrier's bytes that is strong
      enough to accept the true account also accepts that false one, because
      the two differ in what they predicate rather than in which terms they
      use. Reducing the check to a required keyword set would grade whether the
      account speaks the vocabulary of the rules rather than whether it gives
      the reason, which is a weaker claim than the criterion makes. The item
      therefore stays judged.
    weight_source: >-
      Weighted 3 against item 9g's test, which sets 3 where failing the item
      costs substantial but partial credit. A section that states the pairing
      its own reconciliation.json declares and then gives the wrong reason
      still tells a reviewer which receipt matched which row, which is the
      larger half of what the obligation asks; only the why is lost, and a
      reviewer who knows the rules can re-derive it from the inputs the section
      names. That is partial rather than total failure of the obligation, so it
      sits below contested_pairing_matches_declared_matching at 5, where the
      pairing itself is false and nothing in the section survives.
    weight_prior_recording: >-
      Superseded from 5. The earlier value was not derived against item 9g's
      test at all: all three judged items carried 5 with no weight_source,
      which item 10f names as the defect it forbids, "never by a uniform
      default". The 5 is corrected rather than deleted so the uniform-default
      error stays readable as history. Re-derivation moved this item alone;
      the other two were tested the same way and hold at 5 on their own
      grounds, recorded in their own weight_source fields.
  - id: policy_verdict_follows_from_the_two_numbers
    outcome_class: DIVERGENCE
    weight: 5
    negate: false
    obligation: D7-policy-rationale
    dimension: process
    evaluation_target: /app/out/policy-notes.md
    evidence:
      - /app/out/policy-notes.md
      - /app/out/reconciliation.json
      - environment/inputs/policy.json
    criterion: >-
      In each section of /app/out/policy-notes.md, the relation the prose
      asserts between the receipt total and the category limit it names is the
      relation those two numbers actually stand in, and the violation verdict
      the prose states for that pair is the one that relation entails under the
      rule that a pair violates when its category carries a limit and its total
      strictly exceeds it, judged as what the sentences claim rather than which
      numbers they contain.
    residue: >-
      Measured rather than argued. Both compiled items over this carrier were
      executed against a control that replaces the oracle's sentence "8100
      strictly exceeds 7500, by 600 cents, so the pair violates policy" with
      "8100 does not exceed 7500, so the pair does not violate policy", leaving
      the section set, the heading order, the receipt total and the governing
      cap untouched. policy_notes_covers_every_violation returned True and
      policy_notes_names_the_governing_limit returned True on those bytes, so
      the whole compiled surface accepts an account whose arithmetic claim is
      false and whose verdict contradicts /app/out/reconciliation.json.

      The gap is predication again, and it is a different predication from the
      D6 items. Those grade whether a stated pairing matches a declared
      matching and whether a stated reason is the operative rule. This grades
      whether a stated inequality between two integers holds and whether the
      verdict follows from it. A comparator over the carrier's bytes decides
      that both integers occur and that the governing cap rather than a
      neighbour's is cited, which is exactly what the two compiled items do;
      it cannot decide whether "strictly exceeds" or "does not exceed" is the
      true relation between them, because both readings use the same two
      numbers and the same vocabulary. Reducing the check to a required phrase
      such as "strictly exceeds" would grade whether the account speaks the
      rule's words rather than whether its claim is true, and would accept an
      account using that phrase about the wrong pair.

      Not reducible by reading the JSON instead. The verdict is already
      compiled by violation_flags_exact over
      /app/out/reconciliation.json, and that item grades the matching rather
      than the account; an account can carry a verdict that agrees with the
      JSON while asserting an inequality that does not hold, and an account can
      assert a true inequality while stating a verdict the JSON contradicts.
      Those are two distinct defects and the criterion names one condition over
      the account's own sentences, which is why it stays judged.
    weight_source: >-
      Weighted 5 against item 9g's test, which sets 5 where failing the item
      alone fails its obligation. D7-policy-rationale exists to record the
      policy decision on each violating pair. A section stating that a pair
      does not violate where the numbers make it violate, or the reverse,
      records the opposite decision from the one the inputs compel, and a
      reviewer acting on it would clear an over-limit expense or challenge a
      compliant one. No partial credit survives a reversed decision, so this
      sits at 5 rather than at 3 beside
      contested_reason_is_the_operative_rule, where the pairing survives and
      only the explanation is lost.
  - id: parse_notes_attributes_the_colon_mechanism
    outcome_class: DIVERGENCE
    weight: 5
    negate: false
    obligation: D8-parse-rationale
    dimension: process
    evaluation_target: /app/out/parse-notes.md
    evidence:
      - /app/out/parse-notes.md
      - environment/inputs/receipts/
    criterion: >-
      In each section of /app/out/parse-notes.md whose receipt carries a colon
      inside its VENDOR value, the format rule the prose attributes to that
      receipt is the rule that only the first colon on a line separates the
      field name from its value, and the wrong reading the prose describes is
      the truncation a split-on-every-colon parse would produce, judged as what
      the sentences attribute rather than which rules they mention.
    residue: >-
      Measured rather than predicted. A control was built from the oracle's own
      /app/out/parse-notes.md by swapping only the rule-naming sentence: the
      RCP-0003 section was made to claim the trailing-non-field-lines rule and
      the RCP-0004 section the colon rule, with every heading, every quoted
      vendor value and every quoted dropped fragment left exactly as the oracle
      wrote them. Both compiled items over this carrier returned True on those
      bytes, and the oracle returned True on its own, so the whole compiled
      surface accepts an account that attributes the wrong mechanism to the
      wrong receipt.

      Why no comparator separates them. parse_notes_covers_every_hazard
      compares the heading set against the hazard set recomputed from
      environment/inputs/receipts/ and requires a non-empty body, so it reads
      no rule-naming sentence at all. parse_notes_quotes_the_correct_value
      branches on whether the receipt's own bytes carry a colon in VENDOR,
      taken from the receipt rather than from the prose, and then requires the
      true vendor string and, for a colon receipt, the truncated form; the swap
      leaves both of those strings exactly where they were. Every token either
      checker reads survives the swap untouched, which is the gap between
      naming a rule somewhere in a document and attributing it to a receipt.

      Not reducible by requiring the rule's words near the heading. A section
      may state the colon rule correctly and still describe a wrong reading
      that the colon parse would not produce, and proximity of a phrase to a
      heading is not the claim the criterion makes. The criterion names one
      condition over the sentences of the colon sections, so it stays judged.
    weight_source: >-
      Weighted 5 against item 9g's test, which sets 5 where failing the item
      alone fails its obligation. The colon mechanism spans two of the three
      hazardous receipts, RCP-0003 and RCP-0007, so misattributing it corrupts
      the majority of the account. The obligation exists to tell a reader which
      of the two format rules each receipt exercises, and an account that gets
      that wrong on two of three receipts has not performed the obligation at
      all rather than performed it partially.
  - id: parse_notes_attributes_the_nonfield_mechanism
    outcome_class: DIVERGENCE
    weight: 3
    negate: false
    obligation: D8-parse-rationale
    dimension: process
    evaluation_target: /app/out/parse-notes.md
    evidence:
      - /app/out/parse-notes.md
      - environment/inputs/receipts/
    criterion: >-
      In each section of /app/out/parse-notes.md whose receipt carries lines
      that are not field lines, the format rule the prose attributes to that
      receipt is the rule that such lines are ignored, and the wrong reading
      the prose describes is the spurious field an every-line-is-a-field parse
      would admit, judged as what the sentences attribute rather than which
      rules they mention.
    residue: >-
      The same measurement that carries
      parse_notes_attributes_the_colon_mechanism carries this one, and the two
      halves of the control are independently achievable. In the swapped
      carrier the RCP-0004 section claims the colon rule while still quoting
      its true vendor 'Carter & Voss LLP' and both of its trailing lines
      verbatim, so parse_notes_quotes_the_correct_value finds every string it
      requires for a non-colon receipt and returns True, and
      parse_notes_covers_every_hazard never reads the sentence. A comparator
      therefore accepts a section that pins a colon mechanism onto a receipt
      whose VENDOR carries no colon, which the receipt's own bytes contradict.

      Why this is a separate condition rather than the same one. Item 10f
      states that a criterion joining two conditions is two items. The two
      mechanisms are independently misattributable: an account can name the
      colon rule correctly on RCP-0003 and RCP-0007 while pinning the colon
      rule onto RCP-0004 as well, which fails this item and passes the colon
      item, and an account can name the trailing-line rule correctly on
      RCP-0004 while pinning it onto RCP-0003, which fails the colon item and
      passes this one. A single item spanning both would fail on either and so
      could not distinguish them, which is the overlap item 7e refuses within
      one cell.
    weight_source: >-
      Weighted 3 against item 9g's test, which sets 3 where failing the item
      costs substantial but partial credit. The trailing-line mechanism spans
      one receipt of the three, RCP-0004, so misattributing it leaves the
      account correct about RCP-0003 and RCP-0007 and wrong about one row. A
      reviewer still learns which rule governs two of the three hazardous
      receipts, which is partial performance of the obligation rather than
      none. It therefore sits below
      parse_notes_attributes_the_colon_mechanism at 5, whose mechanism spans
      two receipts, and the two weights differ on measured extent rather than
      on preference.
  - id: policy_magnitude_is_the_arithmetic_difference
    outcome_class: VALUE
    weight: 1
    negate: false
    obligation: D7-policy-rationale
    dimension: process
    evaluation_target: /app/out/policy-notes.md
    evidence:
      - /app/out/policy-notes.md
      - environment/inputs/policy.json
    criterion: >-
      In each section of /app/out/policy-notes.md, the figure the prose states
      for how far the receipt total exceeds or falls short of the category limit
      it names is the arithmetic difference between those two numbers, judged as
      the quantity the sentence claims however it is phrased rather than as a
      figure matched in a fixed form.
    residue: >-
    residue: >-
      Measured before the item was frozen, because its own earlier record held
      it as surviving-but-marginal on two doubts and both needed a measurement
      rather than an argument.

      The first doubt was whether the compiled surface already catches it. It
      does not. A control was built from the oracle's own
      /app/out/policy-notes.md by changing the RCP-0005 sentence from "8100
      strictly exceeds 7500, by 600 cents, so the pair violates policy" to "by
      2400 cents", leaving the relation, the verdict, both integers, the
      section set and the heading order untouched; a second control falsified
      the non-violating shortfall from 1800 to 9900. Every compiled item over
      every prose carrier returned True on both:
      policy_notes_covers_every_violation,
      policy_notes_names_the_governing_limit, contested_account_structure,
      contested_account_names_an_alternative, parse_notes_covers_every_hazard
      and parse_notes_quotes_the_correct_value. So the whole compiled surface
      accepts an account whose subtraction is false.

      The second doubt was whether the judgment reduces after all, since the
      magnitude is the difference of two integers a compiled item already
      locates. That was tested rather than assumed, and the answer is that a
      comparator settles a phrase and not the claim. The strongest reasonable
      comparator, binding a "by N cents" phrase in a section and requiring N to
      equal the absolute difference of that section's two numbers, does return
      False on the control in the oracle's exact wording. It returns True on
      the same false claim phrased "exceeding it by 2400", "with a difference
      of 2400 cents", "2400 cents over", and on the figure spelled in words.
      The statement prescribes no wording and says no length is prescribed, so
      a comparator that works only where the solver copies the oracle's
      sentence shape reduces the oracle rather than the judgment. Item 10f's
      clause bites on a judgment deterministically reducible over its named
      evidence, and this one is not.

      Not reducible by reading policy.json instead. The two numbers are
      reference values and policy_notes_names_the_governing_limit already
      requires each section to carry its receipt's total and its own governing
      cap. What that item cannot decide is whether a third figure the prose
      introduces is their difference, because it says nothing about a third
      number. The item therefore stays judged.
    distinguished_from_the_existing_d7_item: >-
      policy_verdict_follows_from_the_two_numbers grades the relation between
      the total and the cap and the verdict that relation entails. A false
      magnitude leaves both of those true: the control asserts "strictly
      exceeds" correctly and "violates policy" correctly and is false only in
      the subtraction. Conversely an account can state a true difference while
      inverting the relation, which fails that item and passes this one. The
      two are therefore distinct checks in the same cell, which item 7e admits
      because its clause is a distinctness requirement and not a count, and
      which item 10f requires because a criterion joining the relation and the
      magnitude would be two items.
    weight_source: >-
      Weighted 1 against item 9g's test, which sets 1 for polish. Ruled from
      the measurement rather than from a preference for a complete scale, and
      the reasoning is the opposite of the two D7 items above it. A reader of a
      section with a false magnitude still learns the receipt's category, its
      total, the limit that governs it, which way the two numbers stand and
      whether the pair violates policy, so every decision the deliverable
      exists to record survives intact and only a derived convenience figure is
      wrong. That is neither a failed obligation nor substantial partial credit
      lost; it is the polish 9g's 1 names.

      The honest answer was checked against the alternative rather than
      assumed. A 3 would claim the failure costs substantial credit, and the
      measurement does not support it: the control's RCP-0005 section remains
      actionable by a reviewer, who can recompute 8100 minus 7500 from the two
      numbers the same sentence names. Had the magnitude been the only place a
      number appeared, a 3 would have been right. It is not, so 1 is.

      This is the first judged item in this rubric at weight 1, and it is here
      because the failure cost puts it here. No item was moved or invented to
      represent the scale, and the earlier record that no judged item was worth
      1 is superseded by this measurement rather than overruled by a
      preference: that record was reasoning about the five items then authored,
      each of which still holds its own weight on its own ground.
  - id: convention_collapse_is_the_true_direction
    outcome_class: DIVERGENCE
    weight: 5
    negate: false
    obligation: D9-convention-divergence-rationale
    dimension: process
    evaluation_target: /app/out/convention-notes.md
    evidence:
      - /app/out/convention-notes.md
      - environment/inputs/statement.csv
      - environment/inputs/receipts/
      - environment/inputs/policy.json
    criterion: >-
      In the collapse section of /app/out/convention-notes.md, the direction and
      the size of the collapse the prose asserts are the ones these inputs make
      true: that dropping the absolute value loses eligible pairs rather than
      gaining them, and that the pairs the signed comparison leaves standing are
      the ones it actually leaves standing, judged as what the sentences claim
      rather than which figures they contain.
    residue: >-
      Measured against the whole compiled surface rather than argued. A control
      was built from the oracle's own /app/out/convention-notes.md by inverting
      only the collapse section: the edge counts were swapped so the prose reads
      that the absolute-value rule admits one pair and the signed comparison
      twelve, the matching counts were swapped so it reads that dropping the
      absolute value would gain ten pairs, and the survivor sentence was
      rewritten to say that RCP-0011 to TXN-1007 is the pair the signed
      comparison drops. The divergence section was left exactly as the oracle
      wrote it. Every compiled item over every prose carrier returned True on
      those bytes: convention_notes_carries_both_sections,
      convention_notes_names_every_row,
      policy_notes_covers_every_violation,
      policy_notes_names_the_governing_limit, contested_account_structure,
      contested_account_names_an_alternative, parse_notes_covers_every_hazard
      and parse_notes_quotes_the_correct_value. So the entire compiled surface
      accepts an account whose central claim is backwards.
    why_no_comparator_settles_it: >-
      The figures are reference values a comparator can recompute, and that is
      exactly why a comparator does not settle this. Both the true and the
      inverted account carry the integers 12, 1, 11 and 10 and the identifiers
      RCP-0011 and TXN-1007; they differ in which rule each figure is attached
      to and in which direction the loss runs. A comparator strong enough to
      bind each figure to its rule would have to parse the sentence structure
      the statement deliberately leaves free, since instruction.md prescribes no
      wording and no length for this deliverable. The same lesson the magnitude
      item measured applies here: a comparator that works only where the solver
      copies the oracle's sentence shape reduces the oracle rather than the
      judgment.

      Nor is it reducible by reading the inputs instead. Rebuilding both graphs
      from environment/inputs/ settles what the figures are, which
      convention_notes_names_every_row already uses for the partition, and
      settles nothing about what the prose asserts them to be.
    weight_source: >-
      Weighted 5 against item 9g's test, which sets 5 where failing the item
      alone fails its obligation. The operator's reading was offered to check
      rather than adopt and it holds on its own terms: this deliverable exists
      to say what dropping the absolute value would cost, so an account with
      the direction backwards tells a reviewer that the mistake is harmless
      when it destroys ten of eleven matched pairs. That is not partial credit;
      it inverts the only conclusion the deliverable carries, and a reviewer
      acting on it would accept the defect the deliverable exists to warn
      against.
  - id: convention_divergence_set_is_the_true_partition
    outcome_class: VALUE
    weight: 3
    negate: false
    obligation: D9-convention-divergence-rationale
    dimension: process
    evaluation_target: /app/out/convention-notes.md
    evidence:
      - /app/out/convention-notes.md
      - environment/inputs/statement.csv
      - environment/inputs/receipts/
      - environment/inputs/policy.json
    criterion: >-
      In the divergence section of /app/out/convention-notes.md, each txn_id the
      prose places among the rows whose eligible set differs between the two
      rules is a row whose set does differ, and each txn_id it places among the
      rows whose set is the same is a row whose set is the same, judged as which
      group the sentences assign each row to rather than which rows they name.
    residue: >-
      Measured against the whole compiled surface rather than argued. A second
      control was built from the oracle's own carrier by inverting only the
      divergence section: the prose was rewritten to say that no row differs
      between the two rules and that the two rules agree on every row,
      TXN-1007 and TXN-1011 included, while still naming all twelve txn_ids.
      The collapse section was left exactly as the oracle wrote it. Every
      compiled item over every prose carrier returned True on those bytes, the
      same eight named in the sibling item's residue, so the compiled surface
      accepts an account that assigns ten diverging rows to the coinciding
      group.

      The reason it accepts is visible in what the compiled item checks.
      convention_notes_names_every_row recomputes both partitions from
      environment/inputs/ and requires the divergence section to name every
      txn_id of both groups; it is a membership test over the section's tokens
      and says nothing about which group a sentence assigns a row to. Measured
      from the opposite side as well: replacing the ten row names with the
      phrase "the debit rows" makes that compiled item return False while
      convention_notes_carries_both_sections returns True, so the compiled item
      is live on naming and silent on assignment.
    weight_source: >-
      Weighted 3 against item 9g's test, which sets 3 where failing the item
      costs substantial but partial credit. The operator's reading was 3 on the
      ground that naming the wrong rows is substantial but leaves the central
      fact standing, and the re-measurement tested that against the alternative
      rather than adopting it. The divergence set is ten of twelve rows, which
      argues for 5; against that, an account with the collapse right and the
      partition wrong still tells a reviewer that dropping the absolute value
      costs ten of eleven pairs, which is the decision the deliverable exists
      to support, and a reviewer can recompute the partition from the inputs
      the section cites. The central conclusion survives and the detail is
      wrong, which is 9g's 3 rather than its 5. It sits below
      convention_collapse_is_the_true_direction, whose failure inverts the
      conclusion itself.
    distinguished_from_the_sibling: >-
      The two items fail on different defects and each control corrupts exactly
      one of them, which is argued from the control design rather than
      executed, since executing a judged item requires a judge and no judge has
      run against this bundle. The collapse control inverts the collapse
      section and leaves the divergence section untouched, so a judge reading it
      should fail convention_collapse_is_the_true_direction and accept
      convention_divergence_set_is_the_true_partition. The divergence control
      inverts the partition and leaves the collapse section untouched, so a
      judge should fail the second and accept the first. That each control
      corrupts the subject of exactly one item is a property of what the
      control alters, not a verdict anyone has read.

      Item 10f requires the split independently: a criterion joining the
      direction of the collapse and the membership of the partition would join
      two conditions, and a single item spanning both would fail on either and
      so could not distinguish them, which is the overlap item 7e refuses
      within one cell.

aggregation:
  rule: weighted-mean
  full_reward: 1.0
  graded_key: reward
  compiled_weight: 85
  judged_weight: 30
  compiled_share: 0.7391304347826086
  source: >-
    delivery.reward in the approved contract binds one graded key named
    reward with full_reward 1.0 over the closed interval 0 to 1. The task
    owner amended that binding from a binary reward to a continuous one on
    2026-10-30, with authority stated, so the rule is the weighted mean and
    the graded key takes the intermediate values the closed interval already
    admitted. full_reward is unchanged: a submission passing every item still
    reads exactly 1.0, which the oracle control confirms.

    The rule is bound once here and read by every Reward Kit table, because a
    judged dimension aggregating by a different rule than the compiled one is
    the defect the contract records under
    uuid_prior_recording_after_scoring_table. tests/judge.toml carries it for
    the judged dimension, tests/reward.toml for [scoring.test_output] and for
    the top-level [[reward]], and that top-level table weights the two
    dimensions by their own graded totals, 85 compiled and 30 judged, so the
    compiled share stays the bound 0.7391304347826086 rather than the 0.5 an
    unweighted pair of dimensions would impose.

    Why the amendment was sought. all-pass reads no weight and returns zero on
    a single failure, so it could not separate a partial answer from an empty
    one: the no-op control and a measured submission passing 26 of the 33
    items both scored exactly 0.0. Under this rule the same three controls
    read 1.0, 0.8174 and 0.0435, so the 25 compiled weights this file already
    assigns become live rather than inert.

# ---------------------------------------------------------------------------
# Item 10f: the judged-item attempt. Every candidate considered over the live
# served application, with the ruling that admitted or refused it under the
# bound rubric.drafting_acceptance_predicate. Recorded here rather than only in
# a report, because "zero judged items" is a measured outcome and the
# measurement is the evidence for it.
# ---------------------------------------------------------------------------
judged_candidates:
  attempted_at: 2026-10-28
  predicate_state_at_attempt: bound
  surface: the application served at 127.0.0.1:8080 by the /app/start.sh deliverable
  method: >-
    Each candidate was measured against the running application with the
    in-image chromium at the bound 1280 by 800 viewport, and separately against
    the bytes its evaluation_target holds. The deciding question is the last
    clause of the predicate's refuses list: a judgment that could be settled by
    a comparison over those bytes is mode compiled under item 10f and is never
    an authoring choice for mode judged. A candidate survives only if no such
    comparison exists.
  candidates:
    - id: violation-legible-as-weight
      criterion: >-
        On the review screen the application serves at /, the policy-state cell
        of every pair whose violates_policy is true resolves to a computed
        font-weight of 700 and every compliant pair to 400, so the distinction
        a reviewer reads survives without colour.
      obligation: D4-served-application
      dimension: outcome
      evaluation_target: GET /
      claimed_residue: >-
        The computed weight is a resolved cascade value rather than a markup
        attribute, so the markup alone does not carry it.
      measured: >-
        Violating rows resolve to 700 and compliant rows to 400, measured at
        the bound viewport.
      ruling: REFUSED
      refused_by: >-
        The refuses clause on reducibility. getComputedStyle(...).fontWeight is
        a deterministic function of the served HTML and the served stylesheet
        under a browser pinned by digest at a fixed viewport, and the comparator
        is an equality against 700 and 400. The claimed residue is false: the
        cascade is computed, not guessed. The check is already carried as the
        compiled item review_screen_structure.
    - id: graded-cells-render-in-a-shipped-font
      criterion: >-
        For every graded element the review screen serves at /,
        document.fonts.check returns true at that element's own computed
        font-weight, font-size and font-family, so nothing renders in a
        fallback the image did not ship.
      obligation: D4-served-application
      dimension: constraints
      evaluation_target: GET /
      claimed_residue: >-
        Font availability is a property of the hydrated document and the image,
        not of the served bytes.
      measured: >-
        document.fonts.check returned true on every graded element, family
        resolving to "Liberation Sans", sans-serif.
      ruling: REFUSED
      refused_by: >-
        The refuses clause on reducibility. The function returns a boolean, and
        the font set is fixed by the verifier image which is pinned by
        per-platform digest, so the outcome is deterministic over the served
        bytes plus a pinned image. Already carried inside review_screen_structure
        and detail_screens_complete.
    - id: matched-table-columns-share-an-edge
      criterion: >-
        Within matched-table on the review screen served at /, every cell of one
        column shares a left edge with every other cell of that column to
        within one device-independent pixel at the 1280 by 800 viewport.
      obligation: D4-served-application
      dimension: craft
      evaluation_target: GET /
      claimed_residue: >-
        Layout geometry exists only once the document is laid out.
      measured: >-
        All six columns measured a left-edge span of 0 pixels.
      ruling: REFUSED
      refused_by: >-
        The refuses clause on reducibility. max(lefts) minus min(lefts) against
        a tolerance of one pixel is an arithmetic comparison over values the
        pinned browser computes deterministically. Already carried as the
        compiled item review_screen_columns_aligned.
    - id: every-graded-value-above-the-fold
      criterion: >-
        At the 1280 by 800 viewport, every element id the review screen served
        at / is required to carry has its bounding rectangle wholly within the
        viewport, so a reviewer reads the whole reconciliation without
        scrolling.
      obligation: D4-served-application
      dimension: craft
      evaluation_target: GET /
      claimed_residue: >-
        Whether a reviewer must scroll is a property of the rendered page.
      measured: >-
        No required element fell below the fold; the list of out-of-viewport
        elements was empty and document.scrollWidth equalled 1280.
      ruling: REFUSED
      refused_by: >-
        The refuses clause on reducibility.
        getBoundingClientRect().bottom compared against the bound viewport
        height is an inequality over a deterministic layout, so a comparator
        settles it. It is also not authored as a compiled item, because the
        statement imposes no no-scroll obligation and item 10f requires a
        criterion to name an obligation the statement declares.
    - id: violation-cell-contrast-is-adequate
      criterion: >-
        The policy-state cell of a violating pair on the review screen served at
        / renders at a WCAG contrast ratio of at least 4.5 against its
        effective background at the 1280 by 800 viewport.
      obligation: D4-served-application
      dimension: craft
      evaluation_target: GET /
      claimed_residue: >-
        Perceptual contrast is a judgement about legibility.
      measured: >-
        The violating cell measured 9.28 and a compliant cell 21.0 against the
        page background.
      ruling: REFUSED
      refused_by: >-
        The refuses clause on reducibility, and the refuses clause on
