# The one private source FORGE Phase build item 10 requires: solution/solve.sh,
# solution/TRUTH.md, tests/test_output.py and the checker fixtures are all
# derived from this file by solution/recompute.py, so the oracle, the
# human-readable truth, the compiled criteria and the fixtures cannot disagree.
# Nothing here is agent-visible. Every value a checker reads is established in
# built environment state and derived here from its grounding source, never
# copied from a statement literal.
#
# Slots stand at placeholder values until item 11a plants the derived tokens;
# the item 2 normalization rewrites exactly this slot form, so planting does
# not move the hash the tokens derive from.

schema: forge.grounding/v1

task:
  name: ethara/ledgerline-review
  scenario: Ledgerline expense reconciliation review application
  turn_shape: single-turn

# ---------------------------------------------------------------------------
