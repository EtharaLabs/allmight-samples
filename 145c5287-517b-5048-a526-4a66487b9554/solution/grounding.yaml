    least one item, covering all nineteen compiled items and both judged items,
    and twenty-five carry a not_applicable reason. No cell is empty and no cell
    carries both an item and a reason. All six dimensions hold at least one
    item: outcome four, coverage four, constraints seven, robustness three,
    process two, craft one.
