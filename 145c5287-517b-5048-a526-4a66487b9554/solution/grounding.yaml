    why_this_surface_does_not_reduce: >-
      The residue is the gap between token presence and predication. Which
      identifiers may lawfully appear in a section is fixed before the prose is
      read, because the eligible set is recomputed from environment/inputs/, so
      every criterion asking only that a token appear reduces to set membership
      over the section's bytes, and two such criteria are authored compiled.
