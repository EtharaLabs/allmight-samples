residue = "Measured before the item was frozen, because its own earlier record held it as surviving-but-marginal on two doubts and both needed a measurement rather than an argument.\nThe first doubt was whether the compiled surface already catches it. It does not. A control was built from the oracle's own /app/out/policy-notes.md by changing the RCP-0005 sentence from \"8100 strictly exceeds 7500, by 600 cents, so the pair violates policy\" to \"by 2400 cents\", leaving the relation, the verdict, both integers, the section set and the heading order untouched; a second control falsified the non-violating shortfall from 1800 to 9900. Every compiled item over every prose carrier returned True on both: policy_notes_covers_every_violation, policy_notes_names_the_governing_limit, contested_account_structure, contested_account_names_an_alternative, parse_notes_covers_every_hazard and parse_notes_quotes_the_correct_value. So the whole compiled surface accepts an account whose subtraction is false.\nThe second doubt was whether the judgment reduces after all, since the magnitude is the difference of two integers a compiled item already locates. That was tested rather than assumed, and the answer is that a comparator settles a phrase and not the claim. The strongest reasonable comparator, binding a \"by N cents\" phrase in a section and requiring N to equal the absolute difference of that section's two numbers, does return False on the control in the oracle's exact wording. It returns True on the same false claim phrased \"exceeding it by 2400\", \"with a difference of 2400 cents\", \"2400 cents over\", and on the figure spelled in words. The statement prescribes no wording and says no length is prescribed, so a comparator that works only where the solver copies the oracle's sentence shape reduces the oracle rather than the judgment. Item 10f's clause bites on a judgment deterministically reducible over its named evidence, and this one is not.\nNot reducible by reading policy