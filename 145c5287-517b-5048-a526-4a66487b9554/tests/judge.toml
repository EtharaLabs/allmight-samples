outcome_class = "DIVERGENCE"
obligation = "D8-parse-rationale"
dimension = "process"
evaluation_target = "/app/out/parse-notes.md"
residue = "Measured rather than predicted. A control was built from the oracle's own /app/out/parse-notes.md by swapping only the rule-naming sentence: the RCP-0003 section was made to claim the trailing-non-field-lines rule and the RCP-0004 section the colon rule, with every heading, every quoted vendor value and every quoted dropped fragment left exactly as the oracle wrote them. Both compiled items over this carrier returned True on those bytes, and the oracle returned True on its own, so the whole compiled surface accepts an account that attributes the wrong mechanism to the wrong receipt.\nWhy no comparator separates them. parse_notes_covers_every_hazard compares the heading set against the hazard set recomputed from environment/inputs/receipts/ and requires a non-empty body, so it reads no rule-naming sentence at all. parse_notes_quotes_the_correct_value branches on whether the receipt's own bytes carry a colon in VENDOR, taken from the receipt rather than from the prose, and then requires the true vendor string and, for a colon receipt, the truncated form; the swap leaves both of those strings exactly where they were. Every token either checker reads survives the swap untouched, which is the gap between naming a rule somewhere in a document and attributing it to a receipt.\nNot reducible by requiring the rule's words near the heading. A section may state the colon rule correctly and still describe a wrong reading that the colon parse would not produce, and proximity of a phrase to a heading is not the claim the criterion makes. The criterion names one condition over the sentences of the colon sections, so it stays judged."

