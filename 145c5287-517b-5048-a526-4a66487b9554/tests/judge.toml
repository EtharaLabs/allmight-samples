[criterion.annotations]
mode = "judged"
outcome_class = "DIVERGENCE"
obligation = "D6-contested-account"
dimension = "process"
evaluation_target = "/app/out/contested.md"
residue = "What blocks compilation is predication, not vocabulary. The pairing this criterion checks is itself a reference value a comparator settles over /app/out/reconciliation.json, so the comparison is deterministic wherever the claim is already structured. The carrier is free English prose, and a comparison over the bytes of that carrier decides only whether an identifier occurs in a section, never what the sentence containing it asserts. A section reading \"TXN-1009 was not matched to RCP-0008; it went to RCP-0011\" carries both identifiers and states the opposite of the matched array, so every substring, regular-expression and token-set comparator over the prose accepts it while the claim is false. Reducing the check to whether the identifiers co-occur would grade whether the account mentions the pairing rather than whether it states it, which is a weaker claim than the criterion makes; reducing it to the JSON instead would grade the matching, which eight compiled items already do, and not the account. The item therefore stays judged against a written document, which is why the bundle declares a judged carrier under item 10f."

