residue = "Measured rather than argued. Both compiled items over this carrier were executed against a control that replaces the oracle's sentence \"8100 strictly exceeds 7500, by 600 cents, so the pair violates policy\" with \"8100 does not exceed 7500, so the pair does not violate policy\", leaving the section set, the heading order, the receipt total and the governing cap untouched. policy_notes_covers_every_violation returned True and policy_notes_names_the_governing_limit returned True on those bytes, so the whole compiled surface accepts an account whose arithmetic claim is false and whose verdict contradicts /app/out/reconciliation.json.\nThe gap is predication again, and it is a different predication from the D6 items. Those grade whether a stated pairing matches a declared matching and whether a stated reason is the operative rule. This grades whether a stated inequality between two integers holds and whether the verdict follows from it. A comparator over the carrier's bytes decides that both integers occur and that the governing cap rather than a neighbour's is cited, which is exactly what the two compiled items do; it cannot decide whether \"strictly exceeds\" or \"does not exceed\" is the true relation between them, because both readings use the same two numbers and the same vocabulary. Reducing the check to a required phrase such as \"strictly exceeds\" would grade whether the account speaks the rule's words rather than whether its claim is true, and would accept an account using that phrase about the wrong pair.\nNot reducible by reading the JSON instead. The verdict is already compiled by violation_flags_exact over /app/out/reconciliation.json, and that item grades the matching rather than the account; an account can carry a verdict that agrees with the JSON while asserting an inequality that does not hold, and an account can assert a true inequality while stating a verdict the JSON contradicts. Those are two distinct defects and the criterion names on