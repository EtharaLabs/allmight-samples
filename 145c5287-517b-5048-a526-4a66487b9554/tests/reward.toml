# One [[reward]] table named reward and one
# [scoring.test_output] table, each setting the aggregation that realizes the
# reward schema the contract's delivery block binds. requirements/client.md
# states "Reward: continuous" without qualification, so both tables aggregate
# by weighted mean: all-pass emits only 0.0 or 1.0 and reads no weight at all.
#
# test_output is the filename stem of tests/test_output.py, which Reward Kit
# exposes as a top-level dimension; [scoring.test_output] configures how that
# file's own criteria combine, and the 25 compiled criteria carry graded
# weights totalling 85.
#
# The [[reward]] weights table names each dimension's own graded-weight total,
# test_output at 85 and judge at 30, because runner.py _group_weights reads
# this table and falls back to 1.0 for a dimension it omits, which would weigh
# 25 compiled criteria equally with 8 judged ones. The three tables here and in
# tests/judge.toml therefore all read weighted-mean, so the judged dimension
# can never aggregate by a different rule than the compiled one.

[scoring.test_output]
aggregation = "weighted-mean"

[[reward]]
name = "reward"
aggregation = "weighted-mean"
weights = { test_output = 85.0, judge = 30.0 }

# Two further [[reward]] tables that re-expose each dimension's own score as a
# top-level key of /logs/verifier/reward.json, so the carrier states the two
# dimension scores it aggregates rather than only their weighted mean.
#
# They are needed because runner.py _discover_layout takes its no-children
# branch for this tests/ directory, which holds no subdirectory: that branch
# returns dimensions={"reward": group} and carries test_output and judge under
# spec_inputs instead. _evaluate_layout seeds scores from dimensions alone and
# then adds one key per spec whose name is not "reward", so with a single
# [[reward]] table named reward the two dimension scores are computed, consumed
# by the weighted mean, and never written. A spec named anything else lands in
# extra_specs and is written.
#
# Each weight table names BOTH dimensions, because _group_weights falls back to
# 1.0 for a dimension a spec omits rather than to 0.0: weights = { test_output
# = 1.0 } alone resolves to {test_output: 1.0, judge: 1.0} and emits the plain
# mean of the two, measured at 0.8941 where the dimensions were 0.7882 and 1.0.
# The zero weight is the one that isolates a dimension, and aggregate_scores
# rejects only negative and non-finite weights, so 0.0 is admitted.
#
# The reward table above stays first and keeps the name reward, which is the
# key harbor reads for the trial's score (telemetry.py rewards.get("reward")),
# so neither table below changes the reward a trial reports.

[[reward]]
name = "test_output_score"
aggregation = "weighted-mean"
weights = { test_output = 1.0, judge = 0.0 }

[[reward]]
name = "judge_score"
aggregation = "weighted-mean"
weights = { test_output = 0.0, judge = 1.0 }
