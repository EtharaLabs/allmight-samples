# Phase build item 8: one [[reward]] table named reward and one
# [scoring.test_output] table, each setting the aggregation that realizes the
# reward schema the contract's delivery block binds. That schema is the
# continuous one the task owner bound on 2026-10-30, so both tables carry the
# weighted mean solution/grounding.yaml records under aggregation.rule, as
# does tests/judge.toml for the judged dimension. The three must agree: a
# judged dimension aggregating by a different rule than the compiled one is
# the defect the contract records under
# uuid_prior_recording_after_scoring_table.
#
# test_output is the filename stem of tests/test_output.py, which Reward Kit
# exposes as a top-level dimension; [scoring.test_output] configures how that
# file's own criteria combine. judge is the stem of tests/judge.toml and is
# the other dimension.
#
# The weights are the two dimensions' own graded totals, 85 compiled and 30
# judged. They are stated rather than defaulted because _group_weights falls
# back to 1.0 per dimension, which would weight 25 compiled items equally
# against 8 judged ones and put the compiled share at 0.5 instead of the
# bound 0.7391304347826086.

[scoring.test_output]
aggregation = "weighted-mean"

[[reward]]
name = "reward"
aggregation = "weighted-mean"
weights = { test_output = 85.0, judge = 30.0 }
