schema_version = "1.4"
# Order is load-bearing, not cosmetic. Harbor restores artifacts into the
# separate verifier in this sequence, and a directory entry empties its target
# before uploading, so "/app" wipes every sibling declared above it. It is
# therefore declared first. "/app/inputs" is its own entry because D4 excludes
# it while checks.py reads workspace/"inputs" for inputs_unmodified and for
# every criterion that recomputes an expected value from the corpus.
artifacts = [
  { source = "/app", destination = "deliverables/D4_application", exclude = [ "inputs", "out" ] },
  { source = "/app/inputs", destination = "deliverables/D5_inputs" },
  { source = "/app/out/reconciliation.json", destination = "deliverables/D1_reconciliation.json" },
  { source = "/app/out/summary.txt", destination = "deliverables/D2_summary.txt" },
  { source = "/app/out/snapshot.sql", destination = "deliverables/D3_reconciliation-table-snapshot.sql" },
  { source = "/app/out/contested.md", destination = "deliverables/D6_contested.md" },
  { source = "/app/out/policy-notes.md", destination = "deliverables/D7_policy-notes.md" },
  { source = "/app/out/parse-notes.md", destination = "deliverables/D8_parse-notes.md" },
  { source = "/app/out/convention-notes.md", destination = "deliverables/D9_convention-notes.md" },
]

[task]
name = "ethara/ledgerline-review"
version = "1.0.0"
description = "Build a web application that reconciles a Ledgerline expense statement against its receipts and policy, and renders the result for review."
authors = [{ name = "shivansh.rai", email = "shivansh.rai@ethara.ai" }]
keywords = ["python", "postgresql", "web-application", "data-reconciliation", "browser-graded"]

# null_floor is measured, not assumed: under the continuous reward the task
# owner bound on 2026-10-30 the no-op control no longer reads 0.0. It banks
# inputs_unmodified, weight 5 of the graded 115, by touching nothing, and
# every other one of the 33 items rejects it. 5/115 rounds to the 0.0435 the
# verifier emits. Under the superseded all-pass rule the same control read
# 0.0, which is why this key did too.
[metadata]
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0435
discrimination_weight = 0.5

[verifier]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
environment_mode = "separate"

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[verifier.environment]
docker_image = "localhost:5001/ledgerline-tests@sha256:1f8fb568b74b157504898e012d7ff11781d2184c07fd1364cac35c011aa5c6c1"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0

[agent]
timeout_sec = 7200.0
network_mode = "no-network"
user = "10001:10001"

[environment]
docker_image = "localhost:5001/ledgerline-env@sha256:e5931807291ac77e59912baef9892e5f8b0b11adc6f254678918916166ad06f5"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

