[task]
name = "ethara/145c5287-517b-5048-a526-4a66487b9554"
version = "1.0.0"
description = "Build a web application that reconciles a Ledgerline expense statement against its receipts and policy, and renders the result for review."
authors = [{ name = "shivansh.rai", email = "shivansh.rai@ethara.ai" }]
keywords = ["python", "postgresql", "web-application", "data-reconciliation", "browser-graded"]

[metadata]
category = "programming"
domain = "enterprise-tool"
difficulty = "hard"
tags = ["reconciliation", "expense-policy", "exact-matching", "parse-hazards", "postgresql", "browser-graded", "written-account"]
reference_benchmark = "Vibe Code Bench (arXiv 2603.04601)"
reference_benchmark_relation = "Used only to calibrate the delivery format and the difficulty target. No instruction text, seed corpus, policy, expected answer, grading criterion or reference implementation is derived from that benchmark or from any other public source; all of it is original work authored for this task."
valid_until = "2028-11-09"
platforms = ["linux/amd64", "linux/arm64"]
null_floor = 0.0
discrimination_weight = 0.5
scoring = "reward = weighted mean over two dimensions, test_output at 85 graded weight and judge at 30, so the compiled criteria carry 85/115 of the reward and the judged prose criteria carry 30/115; the test_output_score and judge_score rewards report each dimension on its own"
difficulty_explanation = "The matching is exact, not approximate: eligibility is an inclusive amount tolerance and date window, the answer must be a maximum-cardinality pairing rather than the first feasible one, and ties are broken by total absolute amount delta, then total absolute date delta, then receipt id, so a greedy or unordered solver lands on a defensible but wrong pairing. The receipt corpus carries parse hazards that change the answer: a colon inside a VENDOR value where only the first colon separates the field, and lines that are not field lines at all. Two readings of the posting convention disagree about which statement rows are eligible, and the task asks for the collapse direction, its size, and the exact set of diverging rows. The result must then be published three ways that cannot be allowed to drift: a JSON deliverable, a PostgreSQL table dump, and a served review surface whose rendered rows agree with the JSON, sort by receipt id, align to within a pixel under a fixed table layout, and complete without a request to any origin but the application's own."
solution_explanation = "solution/solver.py is a standard-library program with uvicorn for serving: it reads the static corpus from /app/inputs, builds the eligibility graph, selects the maximum-cardinality matching under the documented tie-break, derives the policy violations, residual sets and totals, writes the nine deliverables, loads the reconciliation table through psql, and then generates /app/app.py and /app/start.sh by copying its own matching and rendering functions in with inspect.getsource, so the served screens and the JSON are computed by the same code and cannot disagree."
verification_explanation = "tests/test_output.py registers 25 compiled criteria totalling 85 graded weight, each backed by a function in tests/checks.py that re-derives the answer from the shipped inputs rather than trusting the deliverables, compares the JSON, the summary and the table dump against each other, and drives a real Chromium through Playwright to measure the served review and detail screens, their row order, their column alignment and every origin they request. tests/fixtures.json pins the sha256 of all 14 corpus files so a solver that edits its inputs is caught, and tests/cheat-checks.json names that guard. tests/judge.toml adds 8 judged criteria totalling 30 graded weight, scoring whether the written accounts attribute the right mechanism and state the right numbers."

